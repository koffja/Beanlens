<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1140" viewBox="0 0 1320 1140" role="img" aria-labelledby="beanlens-box-workflow-v4.4-title"><title id="beanlens-box-workflow-v4.4-title">BeanLens运行状态流程图</title><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26352e;font-size:20px} .small{font-size:16px;fill:#647166}.tiny{font-size:14px;fill:#647166}.title{font-size:30px;font-weight:650}.head{font-size:23px;font-weight:650}.line{fill:none;stroke:#4d6a58;stroke-width:2}.dim{fill:none;stroke:#9c6546;stroke-width:1.5}.box{fill:#fffef9;stroke:#b8c7ba;stroke-width:2}.soft{fill:#e9f0e7;stroke:#879d87;stroke-width:2}.warn{fill:#fff1d7;stroke:#b08b4d;stroke-width:2}.blue{fill:#edf4f7;stroke:#7899aa;stroke-width:2}.caption{font-size:17px;fill:#7c553e}.bean{fill:#b5bda0;stroke:#6c7a57;stroke-width:1.5}</style><marker id="beanlens-box-workflow-v4.4-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d6a58" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#faf9f3"/><text x="45" y="50" class="title" text-anchor="start">04  一次检测怎样完成</text><text x="45" y="86" class="small" text-anchor="start">这是一份小批样本循环；不是每几秒截图，也不是先存完350g再计算。</text><rect x="250" y="135" width="610" height="85" rx="5" class="soft"/><text x="268" y="167" class="head" text-anchor="start">1  准备</text><text x="268" y="196" class="small" text-anchor="start">C6关闸与去皮；K230启动双摄、模型、TF。</text><path d="M555 220v29" class="line" marker-end="url(#beanlens-box-workflow-v4.4-arrow)"/><rect x="250" y="252" width="610" height="85" rx="5" class="box"/><text x="268" y="284" class="head" text-anchor="start">2  允许一小批</text><text x="268" y="313" class="small" text-anchor="start">K230确认采集在线与缓存余量，发一次开闸许可。</text><path d="M555 337v29" class="line" marker-end="url(#beanlens-box-workflow-v4.4-arrow)"/><rect x="250" y="369" width="610" height="85" rx="5" class="box"/><text x="268" y="401" class="head" text-anchor="start">3  放料并采集</text><text x="268" y="430" class="small" text-anchor="start">C6限时开闸；K230定位、跟踪、复制清晰裁图。</text><path d="M555 454v29" class="line" marker-end="url(#beanlens-box-workflow-v4.4-arrow)"/><rect x="250" y="486" width="610" height="85" rx="5" class="box"/><text x="268" y="518" class="head" text-anchor="start">4  关闸与收尾</text><text x="268" y="547" class="small" text-anchor="start">C6到时关闸；K230继续拍完导嘴残流。</text><path d="M555 571v29" class="line" marker-end="url(#beanlens-box-workflow-v4.4-arrow)"/><rect x="250" y="603" width="610" height="85" rx="5" class="box"/><text x="268" y="635" class="head" text-anchor="start">5  排空后分类</text><text x="268" y="664" class="small" text-anchor="start">每颗两面一次分类；重叠、模糊、错配进入待复核。</text><path d="M555 688v29" class="line" marker-end="url(#beanlens-box-workflow-v4.4-arrow)"/><rect x="250" y="720" width="610" height="85" rx="5" class="box"/><text x="268" y="752" class="head" text-anchor="start">6  写记录与更新</text><text x="268" y="781" class="small" text-anchor="start">K230写TF并更新主屏；C6仅显示侧面状态。</text><path d="M555 805v29" class="line" marker-end="url(#beanlens-box-workflow-v4.4-arrow)"/><rect x="250" y="837" width="610" height="85" rx="5" class="box"/><text x="268" y="869" class="head" text-anchor="start">7  判断是否继续</text><text x="268" y="898" class="small" text-anchor="start">还有豆且无异常：返回步骤2；网络不阻塞放料控制。</text><path d="M555 922v29" class="line" marker-end="url(#beanlens-box-workflow-v4.4-arrow)"/><rect x="250" y="954" width="610" height="85" rx="5" class="soft"/><text x="268" y="986" class="head" text-anchor="start">8  完成与称重</text><text x="268" y="1015" class="small" text-anchor="start">人工确认无残留；静态称重，关闭记录，再排队上传。</text><path d="M250 878H160V290H242" class="line" marker-end="url(#beanlens-box-workflow-v4.4-arrow)"/><text x="55" y="612" class="small" text-anchor="start">还有样本</text><rect x="910" y="350" width="350" height="150" rx="5" class="warn"/><text x="928" y="382" class="head" text-anchor="start">任一步异常 → 停止新进料</text><text x="928" y="411" class="small" text-anchor="start">限位超时 / 失联 / 缓存满</text><text x="928" y="440" class="small" text-anchor="start">图像或存储失败：标记未完成</text><text x="928" y="469" class="small" text-anchor="start">人工排障后重新开始，不自动补开</text><path d="M860 528H893V425H905" class="line" marker-end="url(#beanlens-box-workflow-v4.4-arrow)"/><rect x="910" y="565" width="350" height="150" rx="5" class="blue"/><text x="928" y="597" class="head" text-anchor="start">无需电脑，但需要固件开发</text><text x="928" y="626" class="small" text-anchor="start">页面与图表示意流程。</text><text x="928" y="655" class="small" text-anchor="start">尚未下发设备程序、训练模型</text><text x="928" y="684" class="small" text-anchor="start">或验证硬件整机节拍。</text><text x="45" y="1110" class="caption" text-anchor="start">初始开到位保持100–150ms，只是调试初值；C6控制本地最长开闸期限，不能把这个时间当作固定颗数。</text></svg>