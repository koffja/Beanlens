<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="beanlens-box-sensor-interface-v4.4-title"><title id="beanlens-box-sensor-interface-v4.4-title">山大斯M12工业NPN对射器经光耦接ESP32-C6</title><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26352e;font-size:20px} .small{font-size:16px;fill:#647166}.tiny{font-size:14px;fill:#647166}.title{font-size:30px;font-weight:650}.head{font-size:23px;font-weight:650}.line{fill:none;stroke:#4d6a58;stroke-width:2}.dim{fill:none;stroke:#9c6546;stroke-width:1.5}.box{fill:#fffef9;stroke:#b8c7ba;stroke-width:2}.soft{fill:#e9f0e7;stroke:#879d87;stroke-width:2}.warn{fill:#fff1d7;stroke:#b08b4d;stroke-width:2}.blue{fill:#edf4f7;stroke:#7899aa;stroke-width:2}.caption{font-size:17px;fill:#7c553e}.bean{fill:#b5bda0;stroke:#6c7a57;stroke-width:1.5}</style><marker id="beanlens-box-sensor-interface-v4.4-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d6a58" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#faf9f3"/><text x="45" y="50" class="title" text-anchor="start">09  山大斯24V NPN接口：先转换，再接GPIO</text><text x="45" y="86" class="small" text-anchor="start">仅适用已确认的NPN低端开关版。图中常见线色以实际标签为准，PNP不能套用。</text><rect x="45" y="145" width="360" height="160" rx="5" class="warn"/><text x="63" y="177" class="head" text-anchor="start">山大斯M12发射端</text><text x="63" y="206" class="small" text-anchor="start">电源＋ → 24V</text><text x="63" y="235" class="small" text-anchor="start">电源− → 24V GND</text><text x="63" y="264" class="small" text-anchor="start">型号、等级、动作逻辑待确认</text><rect x="45" y="370" width="360" height="180" rx="5" class="warn"/><text x="63" y="402" class="head" text-anchor="start">山大斯M12接收端</text><text x="63" y="431" class="small" text-anchor="start">电源＋ → 24V；电源− → GND</text><text x="63" y="460" class="small" text-anchor="start">NPN OUT黑线 → 光耦IN−</text><text x="63" y="489" class="small" text-anchor="start">不得直接接C6 GPIO20</text><text x="63" y="518" class="small" text-anchor="start">图示压降/漏电需测量</text><rect x="515" y="290" width="370" height="210" rx="5" class="blue"/><text x="533" y="322" class="head" text-anchor="start">24V NPN输入光耦模块</text><text x="533" y="351" class="small" text-anchor="start">IN＋ ← 24V</text><text x="533" y="380" class="small" text-anchor="start">IN− ← 接收器NPN OUT</text><text x="533" y="409" class="small" text-anchor="start">输出VCC ← C6 3.3V</text><text x="533" y="438" class="small" text-anchor="start">输出GND ← C6 GND</text><text x="533" y="467" class="small" text-anchor="start">输出OUT → C6 GPIO20</text><path d="M405 460H508" class="line" marker-end="url(#beanlens-box-sensor-interface-v4.4-arrow)"/><text x="415" y="441" class="tiny" text-anchor="start">低端输入</text><rect x="995" y="290" width="350" height="155" rx="5" class="soft"/><text x="1013" y="322" class="head" text-anchor="start">ESP32-C6</text><text x="1013" y="351" class="small" text-anchor="start">GPIO20：经过提示</text><text x="1013" y="380" class="small" text-anchor="start">4.7k上拉3.3V（按模块）</text><text x="1013" y="409" class="small" text-anchor="start">不传每颗豆的准确计数</text><path d="M885 395H988" class="line" marker-end="url(#beanlens-box-sensor-interface-v4.4-arrow)"/><text x="900" y="376" class="tiny" text-anchor="start">仅3.3V侧</text><rect x="515" y="575" width="830" height="135" rx="5" class="warn"/><text x="533" y="607" class="head" text-anchor="start">选购条件与台架验收</text><text x="533" y="636" class="small" text-anchor="start">输入支持24V NPN吸电流；输出不能固定5V推挽。</text><text x="533" y="665" class="small" text-anchor="start">遮挡/无遮挡：确认极性，高≥2.5V、低≤0.8V，再测总延迟。</text><text x="533" y="694" class="small" text-anchor="start">供电共地时仅做电平缓冲，不宣称整机电源隔离。</text><rect x="45" y="650" width="360" height="165" rx="5" class="soft"/><text x="63" y="682" class="head" text-anchor="start">不是高速拍照触发器</text><text x="63" y="711" class="small" text-anchor="start">图片标5ms、100Hz。</text><text x="63" y="740" class="small" text-anchor="start">2mm碎片以1m/s通过约2ms，</text><text x="63" y="769" class="small" text-anchor="start">有漏报可能；五槽多豆会合并。</text><text x="63" y="798" class="small" text-anchor="start">放料前相机已连续运行。</text><text x="45" y="875" class="caption" text-anchor="start">光束置出口下约3mm、主视野上方；接收器挡光，检修前关闭激光电源。没有完整型号，不能确认激光等级。</text></svg>