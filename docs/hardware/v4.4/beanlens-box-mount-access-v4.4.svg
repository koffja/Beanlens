<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="945" viewBox="0 0 1420 945" role="img" aria-labelledby="beanlens-box-mount-access-v4.4-title"><title id="beanlens-box-mount-access-v4.4-title">相机独立可调安装与开放称重取豆仓</title><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26352e;font-size:20px} .small{font-size:16px;fill:#647166}.tiny{font-size:14px;fill:#647166}.title{font-size:30px;font-weight:650}.head{font-size:23px;font-weight:650}.line{fill:none;stroke:#4d6a58;stroke-width:2}.dim{fill:none;stroke:#9c6546;stroke-width:1.5}.box{fill:#fffef9;stroke:#b8c7ba;stroke-width:2}.soft{fill:#e9f0e7;stroke:#879d87;stroke-width:2}.warn{fill:#fff1d7;stroke:#b08b4d;stroke-width:2}.blue{fill:#edf4f7;stroke:#7899aa;stroke-width:2}.caption{font-size:17px;fill:#7c553e}.bean{fill:#b5bda0;stroke:#6c7a57;stroke-width:1.5}</style><marker id="beanlens-box-mount-access-v4.4-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d6a58" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#faf9f3"/><text x="45" y="50" class="title" text-anchor="start">08  相机固定与取豆仓</text><text x="45" y="86" class="small" text-anchor="start">支架装在骨架，前固定面板＋侧后检修。盒子只放称台；不用滑轨承担样本重量。</text><rect x="45" y="125" width="620" height="120" rx="5" class="soft"/><text x="63" y="157" class="head" text-anchor="start">相机安装层次</text><text x="63" y="186" class="small" text-anchor="start">180mm横梁 → M5 T螺母 → 可调L支架</text><text x="63" y="215" class="small" text-anchor="start">3mm亚克力/6mm木载板 → 尼龙柱 → 相机PCB</text><rect x="90" y="300" width="480" height="40" fill="#d8dce0" stroke="#768086"/><text x="110" y="326" class="small" text-anchor="start">原色2020横梁，连到主框架</text><path d="M270 340V430H380" class="line"/><rect x="300" y="415" width="110" height="18" fill="#d8dce0" stroke="#768086"/><rect x="340" y="360" width="18" height="75" class="soft"/><rect x="365" y="365" width="60" height="70" class="blue"/><circle cx="414" cy="399" r="25" fill="#48525b"/><circle cx="414" cy="399" r="14" fill="#111e26"/><path d="M445 399H600" class="dim"/><text x="448" y="381" class="small" text-anchor="start">镜头到豆流75起试</text><text x="80" y="485" class="small" text-anchor="start">前后长孔约20；高度调整总量约16。</text><text x="80" y="522" class="small" text-anchor="start">M2/M2.5尼龙柱约6，孔距按相机实物。</text><text x="80" y="559" class="small" text-anchor="start">无孔PCB用边缘夹架；不压镜头或元件。</text><text x="80" y="596" class="caption" text-anchor="start">不固定到开合门，不靠FPC和热熔胶定位。</text><rect x="750" y="125" width="620" height="120" rx="5" class="blue"/><text x="768" y="157" class="head" text-anchor="start">开放取豆仓 / 侧剖面</text><text x="768" y="186" class="small" text-anchor="start">光学底板z195；盒口≤z175，至少20间隙。</text><text x="768" y="215" class="small" text-anchor="start">平台170×180，台面z45；盒≤160×170×130。</text><path d="M800 310H970M1070 310H1320" class="line"/><text x="995" y="295" class="small" text-anchor="middle">落豆口</text><path d="M1020 320V365" class="line" marker-end="url(#beanlens-box-mount-access-v4.4-arrow)"/><rect x="880" y="375" width="350" height="230" class="box"/><text x="1055" y="461" class="head" text-anchor="middle">可抽出的PP盒</text><text x="1055" y="495" class="small" text-anchor="middle">称重时完整放回</text><path d="M880 500H780" class="line" marker-end="url(#beanlens-box-mount-access-v4.4-arrow)"/><text x="765" y="534" class="small" text-anchor="start">向前取出</text><rect x="865" y="605" width="380" height="15" class="soft"/><rect x="1020" y="635" width="160" height="22" class="blue"/><text x="1005" y="693" class="small" text-anchor="start">1kg单点全桥传感器</text><path d="M1120 620V633" class="line"/><text x="795" y="737" class="small" text-anchor="start">盒与平台不碰墙、不碰底板、不接承重滑轨。</text><text x="795" y="773" class="caption" text-anchor="start">抽盒前：停止 → 排空 → 保存稳定重量。</text><rect x="45" y="690" width="620" height="140" rx="5" class="warn"/><text x="63" y="722" class="head" text-anchor="start">第一轮装配只打定位孔</text><text x="63" y="751" class="small" text-anchor="start">先用标尺确认120mm视宽、中心与边缘对焦。</text><text x="63" y="780" class="small" text-anchor="start">锁紧后记录镜头位置；再固定排线与木门。</text><text x="63" y="809" class="small" text-anchor="start">新外壳与新灯要重新拍校准及训练样本。</text><text x="45" y="900" class="caption" text-anchor="start">支架孔位待相机到手实测；GC2093可能有不同PCB。收豆盒放回不自动构成杯到位互锁。</text></svg>