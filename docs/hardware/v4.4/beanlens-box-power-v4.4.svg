<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="1000" viewBox="0 0 1470 1000" role="img" aria-labelledby="beanlens-box-power-v4.4-title"><title id="beanlens-box-power-v4.4-title">24V恒压灯与独立5V逻辑6V舵机电源图</title><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26352e;font-size:20px} .small{font-size:16px;fill:#647166}.tiny{font-size:14px;fill:#647166}.title{font-size:30px;font-weight:650}.head{font-size:23px;font-weight:650}.line{fill:none;stroke:#4d6a58;stroke-width:2}.dim{fill:none;stroke:#9c6546;stroke-width:1.5}.box{fill:#fffef9;stroke:#b8c7ba;stroke-width:2}.soft{fill:#e9f0e7;stroke:#879d87;stroke-width:2}.warn{fill:#fff1d7;stroke:#b08b4d;stroke-width:2}.blue{fill:#edf4f7;stroke:#7899aa;stroke-width:2}.caption{font-size:17px;fill:#7c553e}.bean{fill:#b5bda0;stroke:#6c7a57;stroke-width:1.5}</style><marker id="beanlens-box-power-v4.4-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d6a58" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#faf9f3"/><text x="45" y="50" class="title" text-anchor="start">07  一只24V适配器，支路并联</text><text x="45" y="85" class="small" text-anchor="start">220V只在外置成品适配器内；机器内只布低压。两只降压分别调5.0V和6.0V，不能插错。</text><rect x="45" y="160" width="340" height="135" rx="5" class="warn"/><text x="63" y="192" class="head" text-anchor="start">24V / 4A（96W）推荐</text><text x="63" y="221" class="small" text-anchor="start">主开关＋保险＋星形分线</text><text x="63" y="250" class="small" text-anchor="start">72W为有条件候选，见正文</text><text x="63" y="279" class="small" text-anchor="start">不是旧12V/3A适配器</text><rect x="495" y="125" width="355" height="155" rx="5" class="soft"/><text x="513" y="157" class="head" text-anchor="start">支路1：24V直接供电</text><text x="513" y="186" class="small" text-anchor="start">灯带4×约100mm，各自并联</text><text x="513" y="215" class="small" text-anchor="start">Ra98/6000K同批，≤20W/m预算</text><text x="513" y="244" class="small" text-anchor="start">M12收发＋光耦输入</text><rect x="495" y="340" width="355" height="145" rx="5" class="warn"/><text x="513" y="372" class="head" text-anchor="start">支路2：24V → 5.0V</text><text x="513" y="401" class="small" text-anchor="start">XL4015类独立降压，带散热</text><text x="513" y="430" class="small" text-anchor="start">预留4A；验证实际温升/压降</text><text x="513" y="459" class="small" text-anchor="start">不是把6V再降到5V</text><rect x="495" y="550" width="355" height="145" rx="5" class="warn"/><text x="513" y="582" class="head" text-anchor="start">支路3：24V → 6.0V</text><text x="513" y="611" class="small" text-anchor="start">第二只独立降压，带散热</text><text x="513" y="640" class="small" text-anchor="start">持续3A、短时5A设计余量</text><text x="513" y="669" class="small" text-anchor="start">1000µF/16V近舵机</text><path d="M385 225H430V200H488" class="line" marker-end="url(#beanlens-box-power-v4.4-arrow)"/><path d="M385 225H430V415H488" class="line" marker-end="url(#beanlens-box-power-v4.4-arrow)"/><path d="M385 225H430V625H488" class="line" marker-end="url(#beanlens-box-power-v4.4-arrow)"/><rect x="960" y="125" width="460" height="155" rx="5" class="blue"/><text x="978" y="157" class="head" text-anchor="start">四段灯带都接同一24V端子</text><text x="978" y="186" class="small" text-anchor="start">每段＋接24V，−接24V返回</text><text x="978" y="215" class="small" text-anchor="start">总0.4m×20W/m＝8W≈0.33A</text><text x="978" y="244" class="small" text-anchor="start">不是串联，不需要四只适配器</text><rect x="960" y="340" width="460" height="150" rx="5" class="blue"/><text x="978" y="372" class="head" text-anchor="start">5V → BOX电源口＋C6 USB</text><text x="978" y="401" class="small" text-anchor="start">双GC2093由BOX的CSI接口供电</text><text x="978" y="430" class="small" text-anchor="start">C6板上再转3.3V供少量外设</text><text x="978" y="459" class="small" text-anchor="start">新增外设目标≤35mA，测余量</text><rect x="960" y="550" width="460" height="145" rx="5" class="blue"/><text x="978" y="582" class="head" text-anchor="start">6V → MG996R（红/棕线按实物）</text><text x="978" y="611" class="small" text-anchor="start">PWM来自C6 GPIO2；逻辑接受性待测</text><text x="978" y="640" class="small" text-anchor="start">信号要共地；电流不能经过主控板</text><text x="978" y="669" class="small" text-anchor="start">先空载小角度，卡豆不硬顶</text><path d="M850 200H953" class="line" marker-end="url(#beanlens-box-power-v4.4-arrow)"/><path d="M850 415H953" class="line" marker-end="url(#beanlens-box-power-v4.4-arrow)"/><path d="M850 625H953" class="line" marker-end="url(#beanlens-box-power-v4.4-arrow)"/><rect x="45" y="770" width="665" height="140" rx="5" class="soft"/><text x="63" y="802" class="head" text-anchor="start">3.3V与隔离</text><text x="63" y="831" class="small" text-anchor="start">NAU7802、I²C、光耦输出：3.3V逻辑。</text><text x="63" y="860" class="small" text-anchor="start">B2403S已输出3.3V，后串AMS1117-3.3不成立。</text><text x="63" y="889" class="small" text-anchor="start">共地光耦只做电平缓冲，整机并非电源隔离。</text><rect x="755" y="770" width="665" height="140" rx="5" class="warn"/><text x="773" y="802" class="head" text-anchor="start">功率是设计预算，须带载验证</text><text x="773" y="831" class="small" text-anchor="start">8W灯＋1W光电＋20W/0.85＋18W/0.85≈53.7W。</text><text x="773" y="860" class="small" text-anchor="start">舵机短时30W时整机预算约67.8W。</text><text x="773" y="889" class="small" text-anchor="start">主线/舵机用粗线星形回路；不串接主板地线。</text><text x="45" y="958" class="caption" text-anchor="start">两板UART只接TX/RX/GND，PH2.0的5V不连；USB避免外电与电脑反灌。保险/电容/接头规格见手册。</text></svg>