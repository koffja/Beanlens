<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="985" viewBox="0 0 1420 985" role="img" aria-labelledby="beanlens-box-pp-template-v4.4-title"><title id="beanlens-box-pp-template-v4.4-title">四片PP渐缩料斗净片尺寸与初学者制作流程</title><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26352e;font-size:20px} .small{font-size:16px;fill:#647166}.tiny{font-size:14px;fill:#647166}.title{font-size:30px;font-weight:650}.head{font-size:23px;font-weight:650}.line{fill:none;stroke:#4d6a58;stroke-width:2}.dim{fill:none;stroke:#9c6546;stroke-width:1.5}.box{fill:#fffef9;stroke:#b8c7ba;stroke-width:2}.soft{fill:#e9f0e7;stroke:#879d87;stroke-width:2}.warn{fill:#fff1d7;stroke:#b08b4d;stroke-width:2}.blue{fill:#edf4f7;stroke:#7899aa;stroke-width:2}.caption{font-size:17px;fill:#7c553e}.bean{fill:#b5bda0;stroke:#6c7a57;stroke-width:1.5}</style><marker id="beanlens-box-pp-template-v4.4-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d6a58" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#faf9f3"/><text x="45" y="50" class="title" text-anchor="start">11  PP内衬：四片梯形，先做纸样</text><text x="45" y="85" class="small" text-anchor="start">下图为缩放尺寸说明，不是1:1刀模。实线是净豆路片；折边另外加到外侧，不能从净尺寸里扣。</text><text x="65" y="145" class="head" text-anchor="start">前 / 后各1片，共2片</text><text x="65" y="180" class="small" text-anchor="start">净上140，下110，斜面高122.98</text><path d="M100 235H380L350 480.96H130Z" fill="#f3f1df" stroke="#9c6546" stroke-width="2"/><path d="M100 215L380 215" class="dim"/><path d="M95 210l10 10M375 210l10 10" class="dim"/><text x="220" y="205" class="caption" text-anchor="start">140</text><path d="M130 505L350 505" class="dim"/><path d="M125 500l10 10M345 500l10 10" class="dim"/><text x="220" y="535" class="caption" text-anchor="start">110</text><path d="M420 235L420 480.96" class="dim"/><path d="M415 230l10 10M415 475.96l10 10" class="dim"/><text x="435" y="365" class="caption" text-anchor="start">122.98</text><text x="240" y="350" class="head" text-anchor="middle">PP0.5mm</text><text x="240" y="387" class="small" text-anchor="middle">薄片，冷压折边</text><text x="690" y="145" class="head" text-anchor="start">左 / 右各1片，共2片</text><text x="690" y="180" class="small" text-anchor="start">净上140，下30，斜面高111.02</text><path d="M760 235H1040L930 457.04H870Z" fill="#f3f1df" stroke="#9c6546" stroke-width="2"/><path d="M760 215L1040 215" class="dim"/><path d="M755 210l10 10M1035 210l10 10" class="dim"/><text x="880" y="205" class="caption" text-anchor="start">140</text><path d="M870 505L930 505" class="dim"/><path d="M865 500l10 10M925 500l10 10" class="dim"/><text x="885" y="535" class="caption" text-anchor="start">30</text><path d="M1080 235L1080 457.04" class="dim"/><path d="M1075 230l10 10M1075 452.04l10 10" class="dim"/><text x="1095" y="355" class="caption" text-anchor="start">111.02</text><text x="900" y="335" class="head" text-anchor="middle">不是4片一样</text><text x="900" y="370" class="small" text-anchor="middle">短下口是30</text><rect x="55" y="580" width="620" height="155" rx="5" class="soft"/><text x="73" y="612" class="head" text-anchor="start">拼好后的净几何</text><text x="73" y="641" class="small" text-anchor="start">上口140×140；下口110×30；垂直高110。</text><text x="73" y="670" class="small" text-anchor="start">四条角边长度均约123.9，纸样应能对齐。</text><text x="73" y="699" class="small" text-anchor="start">上沿加10–15外翻固定边；角缝加约10外搭边。</text><rect x="745" y="580" width="620" height="155" rx="5" class="blue"/><text x="763" y="612" class="head" text-anchor="start">工具与连接</text><text x="763" y="641" class="small" text-anchor="start">钢尺/卡尺、纸样、记号笔、剪刀、美工刀、垫板。</text><text x="763" y="670" class="small" text-anchor="start">圆钝工具压折，外压条/小夹子保持形状。</text><text x="763" y="699" class="small" text-anchor="start">PP普通胶难粘；主豆路不打钉、不留逆向台阶。</text><rect x="80" y="800" width="290" height="70" rx="5" class="box"/><text x="98" y="832" class="head" text-anchor="start">1 纸样拼好</text><rect x="410" y="800" width="290" height="70" rx="5" class="box"/><text x="428" y="832" class="head" text-anchor="start">2 描到薄PP</text><rect x="740" y="800" width="290" height="70" rx="5" class="box"/><text x="758" y="832" class="head" text-anchor="start">3 外折并夹持</text><rect x="1070" y="800" width="290" height="70" rx="5" class="box"/><text x="1088" y="832" class="head" text-anchor="start">4 木盒中定位</text><path d="M370 835h28" class="line" marker-end="url(#beanlens-box-pp-template-v4.4-arrow)"/><path d="M700 835h28" class="line" marker-end="url(#beanlens-box-pp-template-v4.4-arrow)"/><path d="M1030 835h28" class="line" marker-end="url(#beanlens-box-pp-template-v4.4-arrow)"/><text x="55" y="940" class="caption" text-anchor="start">不必买热风枪；1mm片更难手折。3mm槽隔板另请店家预切，不能用薄片的剪法强剪厚板。</text></svg>