<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="745" viewBox="0 0 1360 745" role="img" aria-labelledby="beanlens-box-optics-v4.4-title"><title id="beanlens-box-optics-v4.4-title">BeanLens五槽尺寸与前后双摄俯视图</title><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26352e;font-size:20px} .small{font-size:16px;fill:#647166}.tiny{font-size:14px;fill:#647166}.title{font-size:30px;font-weight:650}.head{font-size:23px;font-weight:650}.line{fill:none;stroke:#4d6a58;stroke-width:2}.dim{fill:none;stroke:#9c6546;stroke-width:1.5}.box{fill:#fffef9;stroke:#b8c7ba;stroke-width:2}.soft{fill:#e9f0e7;stroke:#879d87;stroke-width:2}.warn{fill:#fff1d7;stroke:#b08b4d;stroke-width:2}.blue{fill:#edf4f7;stroke:#7899aa;stroke-width:2}.caption{font-size:17px;fill:#7c553e}.bean{fill:#b5bda0;stroke:#6c7a57;stroke-width:1.5}</style><marker id="beanlens-box-optics-v4.4-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d6a58" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#faf9f3"/><text x="45" y="50" class="title" text-anchor="start">02  五槽与前后光路</text><text x="45" y="85" class="small" text-anchor="start">俯视时，豆子向纸面内落下；相机沿前后方向观察全部五槽。</text><rect x="50" y="130" width="570" height="100" rx="5" class="soft"/><text x="68" y="162" class="head" text-anchor="start">五槽盒：外宽110 / 有效区94</text><text x="68" y="191" class="small" text-anchor="start">5×14净宽＋4×3隔板＋2×6边条；两侧各8安装翼</text><rect x="90" y="270" width="70" height="60" class="box"/><text x="125" y="309" class="head" text-anchor="middle">1</text><path d="M90 270l10 12m-10 0l10 12M160 270l-10 12m10 0l-10 12" class="dim"/><rect x="180" y="270" width="70" height="60" class="box"/><text x="215" y="309" class="head" text-anchor="middle">2</text><path d="M180 270l10 12m-10 0l10 12M250 270l-10 12m10 0l-10 12" class="dim"/><rect x="270" y="270" width="70" height="60" class="box"/><text x="305" y="309" class="head" text-anchor="middle">3</text><path d="M270 270l10 12m-10 0l10 12M340 270l-10 12m10 0l-10 12" class="dim"/><rect x="360" y="270" width="70" height="60" class="box"/><text x="395" y="309" class="head" text-anchor="middle">4</text><path d="M360 270l10 12m-10 0l10 12M430 270l-10 12m10 0l-10 12" class="dim"/><rect x="450" y="270" width="70" height="60" class="box"/><text x="485" y="309" class="head" text-anchor="middle">5</text><path d="M450 270l10 12m-10 0l10 12M520 270l-10 12m10 0l-10 12" class="dim"/><text x="90" y="365" class="small" text-anchor="start">通道前后净深12；中央对刷通缝10–12。</text><text x="90" y="400" class="small" text-anchor="start">刷毛可拆：先无刷，再验证轻刷是否改善。</text><text x="90" y="435" class="small" text-anchor="start">丝径0.10–0.15 / 外露10–15 / 每侧侵入1–2</text><text x="90" y="470" class="caption" text-anchor="start">以上是试制初值，不保证定距或统一姿态。</text><rect x="710" y="130" width="590" height="440" class="line"/><rect x="930" y="150" width="150" height="70" rx="5" class="blue"/><text x="948" y="182" class="head" text-anchor="start">相机A</text><rect x="875" y="327" width="260" height="32" class="soft"/><rect x="891" y="334" width="38" height="18" class="box"/><rect x="940" y="334" width="38" height="18" class="box"/><rect x="989" y="334" width="38" height="18" class="box"/><rect x="1038" y="334" width="38" height="18" class="box"/><rect x="1087" y="334" width="38" height="18" class="box"/><rect x="930" y="485" width="150" height="70" rx="5" class="blue"/><text x="948" y="517" class="head" text-anchor="start">相机B</text><path d="M1005 220L850 327M1005 220L1160 327M1005 485L850 359M1005 485L1160 359" class="dim"/><path d="M1005 220V318M1005 485V367" class="line" marker-end="url(#beanlens-box-optics-v4.4-arrow)"/><text x="720" y="351" class="small" text-anchor="start">五槽横向展开</text><text x="735" y="177" class="small" text-anchor="start">工作距离</text><text x="735" y="206" class="small" text-anchor="start">65–85起试</text><rect x="800" y="245" width="60" height="16" fill="#ddc98e" stroke="#a99457" transform="rotate(30 800 245)"/><rect x="1170" y="245" width="60" height="16" fill="#ddc98e" stroke="#a99457" transform="rotate(30 1170 245)"/><rect x="800" y="420" width="60" height="16" fill="#ddc98e" stroke="#a99457" transform="rotate(30 800 420)"/><rect x="1170" y="420" width="60" height="16" fill="#ddc98e" stroke="#a99457" transform="rotate(30 1170 420)"/><text x="750" y="605" class="small" text-anchor="start">24V Ra98四条竖灯：前后各两条，斜照豆面。</text><text x="750" y="638" class="caption" text-anchor="start">前后相机之间不能放整块不透明背板。</text><rect x="50" y="540" width="570" height="110" rx="5" class="warn"/><text x="68" y="572" class="head" text-anchor="start">BOX前贴后，重新量前后相机排线路径</text><text x="68" y="601" class="small" text-anchor="start">确认BOX兼容线的线序/线长；后摄路径更长。</text><text x="68" y="630" class="small" text-anchor="start">不能拿普通FFC盲目加长；断电插拔并做应力固定。</text><text x="45" y="705" class="caption" text-anchor="start">先用静止豆验证中心、左右边缘与±6mm深度清晰度；近距成像失败时，先改镜头/距离，不先加工固定孔。</text></svg>