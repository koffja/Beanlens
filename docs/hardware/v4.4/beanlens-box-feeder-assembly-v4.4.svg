<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030" role="img" aria-labelledby="beanlens-box-feeder-assembly-v4.4-title"><title id="beanlens-box-feeder-assembly-v4.4-title">BeanLens送料组件分层与滑闸驱动装配示意</title><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26352e;font-size:20px} .small{font-size:16px;fill:#647166}.tiny{font-size:14px;fill:#647166}.title{font-size:30px;font-weight:650}.head{font-size:23px;font-weight:650}.line{fill:none;stroke:#4d6a58;stroke-width:2}.dim{fill:none;stroke:#9c6546;stroke-width:1.5}.box{fill:#fffef9;stroke:#b8c7ba;stroke-width:2}.soft{fill:#e9f0e7;stroke:#879d87;stroke-width:2}.warn{fill:#fff1d7;stroke:#b08b4d;stroke-width:2}.blue{fill:#edf4f7;stroke:#7899aa;stroke-width:2}.caption{font-size:17px;fill:#7c553e}.bean{fill:#b5bda0;stroke:#6c7a57;stroke-width:1.5}</style><marker id="beanlens-box-feeder-assembly-v4.4-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d6a58" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#faf9f3"/><text x="45" y="50" class="title" text-anchor="start">03  送料组件分层与滑闸连接</text><text x="45" y="86" class="small" text-anchor="start">分层图为装配示意，层间已拉开。左图看宽度；右图看前后抽拉方向。单位mm。</text><rect x="180" y="135" width="320" height="135" fill="#e7d5b6" stroke="#8c7960"/><path d="M195 135H485L455 270H225Z" class="dim"/><text x="340" y="188" class="head" text-anchor="middle">垂直木壳＋PP内衬</text><text x="340" y="220" class="small" text-anchor="middle">140×140 → 110×30</text><rect x="180" y="270" width="45" height="12" fill="#d8dce0"/><rect x="455" y="270" width="45" height="12" fill="#d8dce0"/><text x="520" y="285" class="small" text-anchor="start">左右托耳，中间贯通</text><path d="M340 275V305" class="line" marker-end="url(#beanlens-box-feeder-assembly-v4.4-arrow)"/><rect x="200" y="315" width="280" height="125" class="soft"/><rect x="225" y="333" width="36" height="90" class="box"/><text x="243" y="382" class="small" text-anchor="middle">1</text><rect x="273" y="333" width="36" height="90" class="box"/><text x="291" y="382" class="small" text-anchor="middle">2</text><rect x="321" y="333" width="36" height="90" class="box"/><text x="339" y="382" class="small" text-anchor="middle">3</text><rect x="369" y="333" width="36" height="90" class="box"/><text x="387" y="382" class="small" text-anchor="middle">4</text><rect x="417" y="333" width="36" height="90" class="box"/><text x="435" y="382" class="small" text-anchor="middle">5</text><text x="65" y="350" class="head" text-anchor="start">五槽盒</text><text x="65" y="379" class="small" text-anchor="start">外宽110</text><text x="65" y="408" class="small" text-anchor="start">高50</text><text x="505" y="346" class="small" text-anchor="start">上部渐缩到净深12</text><text x="505" y="376" class="small" text-anchor="start">z300以下保持12</text><text x="505" y="406" class="small" text-anchor="start">每槽净宽14</text><path d="M340 445V468" class="line" marker-end="url(#beanlens-box-feeder-assembly-v4.4-arrow)"/><rect x="195" y="478" width="290" height="24" fill="#d9dfe3" stroke="#6d818d"/><text x="65" y="495" class="head" text-anchor="start">滑闸</text><text x="200" y="535" class="small" text-anchor="start">110×45，厚0.8–1.0；z292穿过导槽</text><path d="M340 545V565" class="line" marker-end="url(#beanlens-box-feeder-assembly-v4.4-arrow)"/><rect x="205" y="575" width="270" height="60" class="soft"/><rect x="224" y="585" width="36" height="40" class="box"/><path d="M224 590l5 10m-5 0l5 10M260 590l-5 10m5 0l-5 10" class="dim"/><rect x="272" y="585" width="36" height="40" class="box"/><path d="M272 590l5 10m-5 0l5 10M308 590l-5 10m5 0l-5 10" class="dim"/><rect x="320" y="585" width="36" height="40" class="box"/><path d="M320 590l5 10m-5 0l5 10M356 590l-5 10m5 0l-5 10" class="dim"/><rect x="368" y="585" width="36" height="40" class="box"/><path d="M368 590l5 10m-5 0l5 10M404 590l-5 10m5 0l-5 10" class="dim"/><rect x="416" y="585" width="36" height="40" class="box"/><path d="M416 590l5 10m-5 0l5 10M452 590l-5 10m5 0l-5 10" class="dim"/><text x="505" y="595" class="small" text-anchor="start">下段可拆刷条</text><text x="505" y="625" class="small" text-anchor="start">两侧轻触，毛尖向下</text><path d="M340 642V680" class="line" marker-end="url(#beanlens-box-feeder-assembly-v4.4-arrow)"/><path d="M180 695H500" class="dim"/><text x="65" y="700" class="head" text-anchor="start">M12对射</text><circle cx="180" cy="695" r="8" class="blue"/><circle cx="500" cy="695" r="8" class="blue"/><text x="520" y="700" class="small" text-anchor="start">出口下约3；仅提示经过</text><rect x="200" y="745" width="280" height="120" fill="#edf4f7" stroke="#7899aa" stroke-dasharray="5 5"/><text x="340" y="787" class="head" text-anchor="middle">前后相机拍摄区</text><text x="340" y="822" class="small" text-anchor="middle">120×67.5；豆子向下</text><path d="M340 872V905" class="line" marker-end="url(#beanlens-box-feeder-assembly-v4.4-arrow)"/><text x="340" y="935" class="small" text-anchor="middle">下落 → PP收豆盒 → 独立称台</text><rect x="820" y="135" width="520" height="105" rx="5" class="blue"/><text x="838" y="167" class="head" text-anchor="start">右侧剖面：舵机在后上方</text><text x="838" y="196" class="small" text-anchor="start">滑闸前后抽拉；只画一槽及后相机视锥。</text><text x="838" y="225" class="small" text-anchor="start">位置关系示意，机身/球头孔位按实物。</text><rect x="960" y="295" width="64" height="180" class="soft"/><text x="992" y="329" class="small" text-anchor="middle">一槽</text><path d="M992 350V386" class="line" marker-end="url(#beanlens-box-feeder-assembly-v4.4-arrow)"/><rect x="902" y="444" width="180" height="12" fill="#d9dfe3" stroke="#6d818d"/><rect x="1060" y="444" width="180" height="12" fill="none" stroke="#6d818d" stroke-dasharray="6 4"/><text x="840" y="425" class="small" text-anchor="start">滑片z292</text><path d="M1082 525L1142 525" class="dim"/><path d="M1077 520l10 10M1137 520l10 10" class="dim"/><text x="1060" y="552" class="caption" text-anchor="start">前后行程约15</text><rect x="1140" y="404" width="140" height="86" class="blue"/><text x="1210" y="446" class="head" text-anchor="middle">MG996R</text><text x="1210" y="475" class="small" text-anchor="middle">固定在后支架</text><circle cx="1210" cy="404" r="15" fill="#edf4f7" stroke="#7899aa"/><path d="M1210 404L1185 380L1065 450" class="line"/><circle cx="1185" cy="380" r="5" fill="#fff" stroke="#4d6a58"/><circle cx="1065" cy="450" r="5" fill="#fff" stroke="#4d6a58"/><text x="1100" y="300" class="small" text-anchor="start">舵轴z315 / 壳下沿约z272</text><text x="1100" y="335" class="small" text-anchor="start">球头连杆跨约23高度差</text><path d="M992 479V690" class="line" marker-end="url(#beanlens-box-feeder-assembly-v4.4-arrow)"/><rect x="960" y="484" width="64" height="135" fill="#edf4f7" stroke="#7899aa" stroke-dasharray="4 4"/><text x="839" y="594" class="small" text-anchor="start">视野顶z275</text><text x="839" y="628" class="small" text-anchor="start">前后相机轴z241.25</text><rect x="1315" y="535" width="24" height="35" class="box"/><path d="M1315 552L1024 484M1315 552L1024 619" class="dim"/><text x="1150" y="601" class="small" text-anchor="start">后摄视锥</text><text x="1070" y="650" class="small" text-anchor="start">舵机与连杆均须避开视锥</text><text x="850" y="715" class="small" text-anchor="start">两限位：开到位/关到位；先手推，再标定。</text><text x="850" y="747" class="caption" text-anchor="start">夹豆超时停止，不靠扭矩硬剪豆。</text><rect x="820" y="800" width="520" height="125" rx="5" class="warn"/><text x="838" y="832" class="head" text-anchor="start">装配顺序</text><text x="838" y="861" class="small" text-anchor="start">木壳、PP内衬、槽盒固定 → 手推滑片 → 舵机与限位</text><text x="838" y="890" class="small" text-anchor="start">无刷送料测试 → 可拆刷条对照 → 装光电。</text><text x="838" y="919" class="small" text-anchor="start">相机、灯和回收杯位置见01、02图。</text><text x="45" y="996" class="caption" text-anchor="start">海洋板支撑；豆路为PP/POM/PBT；手动止料片保留。图中连杆仅示意，孔位须按舵盘与行程实测。</text></svg>