<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="985" viewBox="0 0 1460 985" role="img" aria-labelledby="beanlens-box-screen-mount-v4.4-title"><title id="beanlens-box-screen-mount-v4.4-title">BOX主屏前贴与C6侧贴安装剖面</title><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26352e;font-size:20px} .small{font-size:16px;fill:#647166}.tiny{font-size:14px;fill:#647166}.title{font-size:30px;font-weight:650}.head{font-size:23px;font-weight:650}.line{fill:none;stroke:#4d6a58;stroke-width:2}.dim{fill:none;stroke:#9c6546;stroke-width:1.5}.box{fill:#fffef9;stroke:#b8c7ba;stroke-width:2}.soft{fill:#e9f0e7;stroke:#879d87;stroke-width:2}.warn{fill:#fff1d7;stroke:#b08b4d;stroke-width:2}.blue{fill:#edf4f7;stroke:#7899aa;stroke-width:2}.caption{font-size:17px;fill:#7c553e}.bean{fill:#b5bda0;stroke:#6c7a57;stroke-width:1.5}</style><marker id="beanlens-box-screen-mount-v4.4-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d6a58" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#faf9f3"/><text x="45" y="50" class="title" text-anchor="start">10  屏幕贴在面板，主板放在箱内</text><text x="45" y="85" class="small" text-anchor="start">BOX保留原屏/主板连接，优先整套托架固定；前面板固定，检修走侧后，避免拉扯相机排线。</text><rect x="45" y="125" width="630" height="145" rx="5" class="soft"/><text x="63" y="157" class="head" text-anchor="start">正面位置：主结果界面</text><text x="63" y="186" class="small" text-anchor="start">BOX原壳64.30×47.60×15.40，不含突起物</text><text x="63" y="215" class="small" text-anchor="start">2.4英寸640×480：分类颗数/比例/净重/拒判</text><text x="63" y="244" class="small" text-anchor="start">开孔、按钮与接口避让必须用到手纸样</text><rect x="175" y="315" width="370" height="425" fill="#e7d5b6" stroke="#8c7960"/><rect x="304" y="380" width="112.46" height="83.3" rx="4" fill="#252c2c"/><text x="360" y="414" class="tiny" text-anchor="middle">K230D</text><text x="360" y="445" class="tiny" text-anchor="middle">分类统计</text><text x="360" y="350" class="head" text-anchor="middle">前固定面板</text><circle cx="290" cy="585" r="14" fill="#cbd0d3" stroke="#777"/><text x="290" y="630" class="small" text-anchor="middle">开始</text><circle cx="430" cy="585" r="14" fill="#cbd0d3" stroke="#777"/><text x="430" y="630" class="small" text-anchor="middle">停止</text><text x="210" y="695" class="small" text-anchor="start">两只16mm金属自复位按钮</text><rect x="755" y="125" width="650" height="145" rx="5" class="blue"/><text x="773" y="157" class="head" text-anchor="start">侧剖面：屏幕面朝外，板和线朝内</text><text x="773" y="186" class="small" text-anchor="start">外部只留薄边框；箱内服务深度至少约35起试</text><text x="773" y="215" class="small" text-anchor="start">USB/TF访问留口；插头转弯按实际再加量</text><text x="773" y="244" class="small" text-anchor="start">服务隔舱遮住背光，不能碰前相机或料斗</text><rect x="850" y="360" width="18" height="50" fill="#e7d5b6" stroke="#8c7960"/><rect x="850" y="552" width="18" height="98" fill="#e7d5b6" stroke="#8c7960"/><rect x="838" y="410" width="12" height="142" fill="#222"/><rect x="850" y="410" width="46" height="142" class="blue"/><path d="M898 425H940V390H1010M898 535H940V570H1010" class="line"/><text x="785" y="330" class="head" text-anchor="start">箱外</text><text x="1085" y="330" class="head" text-anchor="start">箱内服务腔</text><text x="985" y="440" class="small" text-anchor="start">内托架固定原壳</text><text x="985" y="478" class="small" text-anchor="start">不是外伸支架</text><path d="M896 515H1100V595" class="dim"/><text x="1035" y="630" class="small" text-anchor="start">线缆应力释放</text><path d="M866 690L971 690" class="dim"/><path d="M861 685l10 10M966 685l10 10" class="dim"/><text x="920" y="722" class="caption" text-anchor="start">预留服务深度约35</text><rect x="755" y="775" width="650" height="120" rx="5" class="soft"/><text x="773" y="807" class="head" text-anchor="start">右侧小屏</text><text x="773" y="836" class="small" text-anchor="start">C6的1.47屏贴右侧面板；主板背面也在箱内。</text><text x="773" y="865" class="small" text-anchor="start">只放Wi-Fi、上传队列、限位与维护告警；避开天线金属。</text><text x="45" y="940" class="caption" text-anchor="start">嵌装前先确认原壳可夹持位置；不钻主板，不切排线，不用边框压触摸有效区。外观图不是开孔模板。</text></svg>