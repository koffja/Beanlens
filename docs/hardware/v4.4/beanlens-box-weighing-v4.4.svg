<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1010" viewBox="0 0 1460 1010" role="img" aria-labelledby="beanlens-box-weighing-v4.4-title"><title id="beanlens-box-weighing-v4.4-title">1kg单点称重受力结构与0.1g验证要求</title><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26352e;font-size:20px} .small{font-size:16px;fill:#647166}.tiny{font-size:14px;fill:#647166}.title{font-size:30px;font-weight:650}.head{font-size:23px;font-weight:650}.line{fill:none;stroke:#4d6a58;stroke-width:2}.dim{fill:none;stroke:#9c6546;stroke-width:1.5}.box{fill:#fffef9;stroke:#b8c7ba;stroke-width:2}.soft{fill:#e9f0e7;stroke:#879d87;stroke-width:2}.warn{fill:#fff1d7;stroke:#b08b4d;stroke-width:2}.blue{fill:#edf4f7;stroke:#7899aa;stroke-width:2}.caption{font-size:17px;fill:#7c553e}.bean{fill:#b5bda0;stroke:#6c7a57;stroke-width:1.5}</style><marker id="beanlens-box-weighing-v4.4-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d6a58" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#faf9f3"/><text x="45" y="50" class="title" text-anchor="start">12  1kg称重：受力路径与0.1g验收</text><text x="45" y="85" class="small" text-anchor="start">0.1g显示不是±0.1g实际误差。传感器价格待询，不沿用旧版15元估价；总量程包括平台和盒。</text><rect x="45" y="125" width="630" height="120" rx="5" class="soft"/><text x="63" y="157" class="head" text-anchor="start">载荷从哪里走</text><text x="63" y="186" class="small" text-anchor="start">豆＋PP盒 → 轻平台 → 载荷端 → 传感器 → 固定底座</text><text x="63" y="215" class="small" text-anchor="start">平台/盒不碰墙、不接滑轨；中段留形变间隙。</text><rect x="125" y="295" width="420" height="165" class="box"/><text x="335" y="377" class="head" text-anchor="middle">PP盒＋净样本0–500g</text><rect x="105" y="460" width="460" height="14" class="soft"/><rect x="400" y="474" width="32" height="55" class="blue"/><rect x="220" y="530" width="250" height="28" class="blue"/><rect x="235" y="558" width="32" height="50" class="soft"/><rect x="95" y="608" width="490" height="20" fill="#d8dce0" stroke="#768086"/><text x="95" y="668" class="small" text-anchor="start">固定端：铝底座连接2020底梁</text><text x="455" y="510" class="small" text-anchor="start">载荷端</text><path d="M335 410V450" class="line" marker-end="url(#beanlens-box-weighing-v4.4-arrow)"/><path d="M418 475V522" class="line" marker-end="url(#beanlens-box-weighing-v4.4-arrow)"/><path d="M250 565V600" class="line" marker-end="url(#beanlens-box-weighing-v4.4-arrow)"/><text x="95" y="710" class="small" text-anchor="start">梁中段不加顶紧螺钉，线缆留软弯。</text><text x="95" y="745" class="small" text-anchor="start">过载挡块正常不碰台，间隙按原厂位移。</text><rect x="755" y="125" width="650" height="160" rx="5" class="warn"/><text x="773" y="157" class="head" text-anchor="start">先做质量预算，再去皮</text><text x="773" y="186" class="small" text-anchor="start">空盒＋平台/承重件目标≤250g。</text><text x="773" y="215" class="small" text-anchor="start">再加500g样本，正常约≤750g，总量程1kg。</text><text x="773" y="244" class="small" text-anchor="start">去皮只减显示数字，不改变实际载荷。</text><rect x="755" y="335" width="650" height="160" rx="5" class="blue"/><text x="773" y="367" class="head" text-anchor="start">电子部分</text><text x="773" y="396" class="small" text-anchor="start">C6 3.3V → NAU7802；内部VDDA约3.0V起试。</text><text x="773" y="425" class="small" text-anchor="start">按模块原理图配桥激励/参考，首试10SPS。</text><text x="773" y="454" class="small" text-anchor="start">2mV/V、1kg桥：0.1g信号约0.6µV，不靠位数保证。</text><rect x="755" y="545" width="650" height="190" rx="5" class="soft"/><text x="773" y="577" class="head" text-anchor="start">验收目标，尚未通过</text><text x="773" y="606" class="small" text-anchor="start">净0/100/350/500g，上升下降各组误差≤±0.1g。</text><text x="773" y="635" class="small" text-anchor="start">100/500g各10次；中心/四角、热机与抽盒归位。</text><text x="773" y="664" class="small" text-anchor="start">砝码不确定度建议≤0.03g；记录原始值和漂移。</text><text x="773" y="693" class="small" text-anchor="start">落豆/闸门动作结束后才取稳定最终质量。</text><rect x="45" y="815" width="1360" height="110" rx="5" class="warn"/><text x="63" y="847" class="head" text-anchor="start">采购底线</text><text x="63" y="876" class="small" text-anchor="start">要具体型号的非线性、滞后、重复性、蠕变、温漂、平台尺寸和低压激励资料。</text><text x="63" y="905" class="small" text-anchor="start">单项0.02%FS在1kg已经0.2g；只写C2/C3、24位或“高精度”不足以保证±0.1g。</text><text x="45" y="970" class="caption" text-anchor="start">未达目标时，只声明显示分度0.1g。先用可靠电子秤作对照也可以，但不伪装成已完成内置称重。</text></svg>