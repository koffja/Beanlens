<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="970" viewBox="0 0 1470 970" role="img" aria-labelledby="beanlens-box-information-flow-v4.4-title"><title id="beanlens-box-information-flow-v4.4-title">BeanLens详细图像、控制和结果信息流</title><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26352e;font-size:20px} .small{font-size:16px;fill:#647166}.tiny{font-size:14px;fill:#647166}.title{font-size:30px;font-weight:650}.head{font-size:23px;font-weight:650}.line{fill:none;stroke:#4d6a58;stroke-width:2}.dim{fill:none;stroke:#9c6546;stroke-width:1.5}.box{fill:#fffef9;stroke:#b8c7ba;stroke-width:2}.soft{fill:#e9f0e7;stroke:#879d87;stroke-width:2}.warn{fill:#fff1d7;stroke:#b08b4d;stroke-width:2}.blue{fill:#edf4f7;stroke:#7899aa;stroke-width:2}.caption{font-size:17px;fill:#7c553e}.bean{fill:#b5bda0;stroke:#6c7a57;stroke-width:1.5}</style><marker id="beanlens-box-information-flow-v4.4-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d6a58" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#faf9f3"/><text x="45" y="50" class="title" text-anchor="start">05  信息流：图片在哪里，谁控制什么</text><text x="45" y="86" class="small" text-anchor="start">蓝色为图像数据；绿色为结构化结果；棕色为控制。UART不传整帧图片。</text><rect x="35" y="160" width="275" height="110" rx="5" class="blue"/><text x="53" y="192" class="head" text-anchor="start">相机A / CSI2</text><text x="53" y="221" class="small" text-anchor="start">高分辨率原图与采集时间</text><text x="53" y="250" class="small" text-anchor="start">原厂兼容GC2093</text><rect x="35" y="330" width="275" height="110" rx="5" class="blue"/><text x="53" y="362" class="head" text-anchor="start">相机B / CSI1</text><text x="53" y="391" class="small" text-anchor="start">同一豆帘的另一可见面</text><text x="53" y="420" class="small" text-anchor="start">独立时间戳，非硬同步</text><rect x="365" y="120" width="620" height="570" fill="#f1f4ed" stroke="#879d87" stroke-width="2"/><text x="390" y="160" class="head" text-anchor="start">K230D BOX / 视觉与证据</text><rect x="390" y="190" width="265" height="105" rx="5" class="blue"/><text x="408" y="222" class="head" text-anchor="start">采集与轻量定位</text><text x="408" y="251" class="small" text-anchor="start">逐槽检查前景与运动</text><rect x="690" y="190" width="265" height="105" rx="5" class="blue"/><text x="708" y="222" class="head" text-anchor="start">轨迹与豆子ID</text><text x="708" y="251" class="small" text-anchor="start">去重；记录槽号与时间</text><rect x="690" y="340" width="265" height="105" rx="5" class="blue"/><text x="708" y="372" class="head" text-anchor="start">清晰裁图缓存</text><text x="708" y="401" class="small" text-anchor="start">8–16颗试起；留残流余量</text><rect x="390" y="340" width="265" height="105" rx="5" class="blue"/><text x="408" y="372" class="head" text-anchor="start">YOLO26n-cls</text><text x="408" y="401" class="small" text-anchor="start">完整豆体224×224分类</text><rect x="390" y="490" width="265" height="105" rx="5" class="soft"/><text x="408" y="522" class="head" text-anchor="start">两面融合与质量门槛</text><text x="408" y="551" class="small" text-anchor="start">未知单列；不当作正常</text><rect x="690" y="490" width="265" height="105" rx="5" class="soft"/><text x="708" y="522" class="head" text-anchor="start">记录与批次完整性</text><text x="708" y="551" class="small" text-anchor="start">原图证据、模型/校准版本</text><path d="M310 215H383" class="line" marker-end="url(#beanlens-box-information-flow-v4.4-arrow)"/><path d="M310 385H342V245H383" class="line" marker-end="url(#beanlens-box-information-flow-v4.4-arrow)"/><path d="M655 242H683" class="line" marker-end="url(#beanlens-box-information-flow-v4.4-arrow)"/><path d="M822 295V333" class="line" marker-end="url(#beanlens-box-information-flow-v4.4-arrow)"/><path d="M690 392H662" class="line" marker-end="url(#beanlens-box-information-flow-v4.4-arrow)"/><path d="M522 445V483" class="line" marker-end="url(#beanlens-box-information-flow-v4.4-arrow)"/><path d="M655 542H683" class="line" marker-end="url(#beanlens-box-information-flow-v4.4-arrow)"/><text x="390" y="649" class="small" text-anchor="start">前贴2.4主屏显示分类统计；采集不做阻塞推理。</text><rect x="1065" y="140" width="360" height="150" rx="5" class="warn"/><text x="1083" y="172" class="head" text-anchor="start">ESP32-C6 / 本地控制</text><text x="1083" y="201" class="small" text-anchor="start">MG996R、限位、M12光电</text><text x="1083" y="230" class="small" text-anchor="start">NAU7802与1kg称台</text><text x="1083" y="259" class="small" text-anchor="start">外接开始/暂停、停止键</text><rect x="1065" y="390" width="360" height="145" rx="5" class="soft"/><text x="1083" y="422" class="head" text-anchor="start">ESP32-C6 / 状态与联网</text><text x="1083" y="451" class="small" text-anchor="start">侧面1.47屏：网络、关闸、告警</text><text x="1083" y="480" class="small" text-anchor="start">已有模块，采购金额记0</text><text x="1083" y="509" class="small" text-anchor="start">网络任务不能延长开闸期限</text><path d="M985 190H1058" class="line" marker-end="url(#beanlens-box-information-flow-v4.4-arrow)"/><text x="990" y="172" class="tiny" text-anchor="start">许可/停止</text><path d="M1065 315H1015V285H992" class="line" marker-end="url(#beanlens-box-information-flow-v4.4-arrow)"/><text x="1020" y="344" class="tiny" text-anchor="start">限位/重量/事件</text><path d="M985 580H1020V460H1058" class="line" marker-end="url(#beanlens-box-information-flow-v4.4-arrow)"/><text x="1018" y="610" class="tiny" text-anchor="start">编号＋结果摘要</text><rect x="365" y="760" width="620" height="110" rx="5" class="blue"/><text x="383" y="792" class="head" text-anchor="start">K230 TF：本机证据主档</text><text x="383" y="821" class="small" text-anchor="start">CSV/JSONL＋疑似/拒判图＋抽查图；frame原图不全量存储。</text><text x="383" y="850" class="small" text-anchor="start">同一记录保留sample_id、batch_id、bean_id、两面图与版本。</text><path d="M822 595V753" class="line" marker-end="url(#beanlens-box-information-flow-v4.4-arrow)"/><rect x="1065" y="760" width="360" height="110" rx="5" class="soft"/><text x="1083" y="792" class="head" text-anchor="start">Wi-Fi → TasterMatrix</text><text x="1083" y="821" class="small" text-anchor="start">只上传JSON摘要；失败待补传。</text><text x="1083" y="850" class="small" text-anchor="start">图片：首版TF导入，上传另验。</text><path d="M1245 535V753" class="line" marker-end="url(#beanlens-box-information-flow-v4.4-arrow)"/><text x="45" y="930" class="caption" text-anchor="start">截图是选取内存中的帧，不是重新启动相机；必须复制需要保留的裁图，避免下一帧覆盖。云端接口仍待实现。</text></svg>