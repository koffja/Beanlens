<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1050" viewBox="0 0 1220 1050" role="img" aria-labelledby="beanlens-box-sequence-v4.4-title"><title id="beanlens-box-sequence-v4.4-title">K230D BOX与ESP32-C6的控制与数据时序图</title><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26352e;font-size:20px} .small{font-size:16px;fill:#647166}.tiny{font-size:14px;fill:#647166}.title{font-size:30px;font-weight:650}.head{font-size:23px;font-weight:650}.line{fill:none;stroke:#4d6a58;stroke-width:2}.dim{fill:none;stroke:#9c6546;stroke-width:1.5}.box{fill:#fffef9;stroke:#b8c7ba;stroke-width:2}.soft{fill:#e9f0e7;stroke:#879d87;stroke-width:2}.warn{fill:#fff1d7;stroke:#b08b4d;stroke-width:2}.blue{fill:#edf4f7;stroke:#7899aa;stroke-width:2}.caption{font-size:17px;fill:#7c553e}.bean{fill:#b5bda0;stroke:#6c7a57;stroke-width:1.5}</style><marker id="beanlens-box-sequence-v4.4-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d6a58" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#faf9f3"/><text x="45" y="50" class="title" text-anchor="start">06  两板如何协同</text><text x="45" y="86" class="small" text-anchor="start">纵向只表示先后顺序，不代表真实毫秒比例。命令需含batch_id、seq、有效期和ACK。</text><rect x="60" y="125" width="300" height="70" rx="5" class="soft"/><text x="78" y="157" class="head" text-anchor="start">K230D：视觉</text><path d="M210 195V840" class="dim"/><rect x="460" y="125" width="300" height="70" rx="5" class="soft"/><text x="478" y="157" class="head" text-anchor="start">C6：闸门/称重</text><path d="M610 195V840" class="dim"/><rect x="860" y="125" width="300" height="70" rx="5" class="soft"/><text x="878" y="157" class="head" text-anchor="start">TasterMatrix / 网络</text><path d="M1010 195V840" class="dim"/><path d="M210 240H610" class="line" marker-end="url(#beanlens-box-sequence-v4.4-arrow)"/><text x="225" y="228" class="small" text-anchor="start">HELLO：协议、启动会话与版本</text><path d="M610 305H210" class="line" marker-end="url(#beanlens-box-sequence-v4.4-arrow)"/><text x="225" y="293" class="small" text-anchor="start">CLOSED：关闸到位、就绪</text><path d="M210 370H610" class="line" marker-end="url(#beanlens-box-sequence-v4.4-arrow)"/><text x="225" y="358" class="small" text-anchor="start">GRANT：本批一次许可＋最长期限</text><path d="M610 435H210" class="line" marker-end="url(#beanlens-box-sequence-v4.4-arrow)"/><text x="225" y="423" class="small" text-anchor="start">OPENED / CLOSED：实际开关事件</text><path d="M210 500h230v35h-230" class="line" marker-end="url(#beanlens-box-sequence-v4.4-arrow)"/><text x="225" y="490" class="small" text-anchor="start">持续采集残流 → 排空 → 分类</text><path d="M210 570H610" class="line" marker-end="url(#beanlens-box-sequence-v4.4-arrow)"/><text x="225" y="558" class="small" text-anchor="start">RESULT：计数、拒判、证据索引</text><path d="M610 635H210" class="line" marker-end="url(#beanlens-box-sequence-v4.4-arrow)"/><text x="225" y="623" class="small" text-anchor="start">ACK：摘要已保存；重量仅在静止有效</text><path d="M610 700H1010" class="line" marker-end="url(#beanlens-box-sequence-v4.4-arrow)"/><text x="625" y="688" class="small" text-anchor="start">待上传JSON；超时先结束网络操作</text><path d="M1010 765H610" class="line" marker-end="url(#beanlens-box-sequence-v4.4-arrow)"/><text x="625" y="753" class="small" text-anchor="start">ACK：按batch_id/seq防止重复入库</text><rect x="60" y="890" width="1100" height="120" rx="5" class="warn"/><text x="78" y="922" class="head" text-anchor="start">失联或命令过期：C6关闭闸门，不因重发重复开闸</text><text x="78" y="951" class="small" text-anchor="start">启动会话号改变后作废旧许可；JPEG不通过这条串口传；序号复用不能产生二次放料。</text><text x="78" y="980" class="small" text-anchor="start">建议心跳200ms、失联阈值800ms作为调试初值；开闸仍受更短的本地动作期限限制。</text></svg>