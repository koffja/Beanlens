<svg xmlns="http://www.w3.org/2000/svg" width="110mm" height="84mm" viewBox="0 0 110 84"><rect width="110" height="84" fill="white"/><g font-family="sans-serif" fill="#294550"><text x="8" y="9" font-size="4">H3-P4 · BOX-clip 20×12铝压片</text><text x="8" y="15" font-size="3">单位mm；100%实际尺寸；先量50mm标尺并对实物</text><g transform="translate(12 22)" fill="none" stroke="#294550" stroke-width=".3"><rect width="12" height="20"/><circle cx="6" cy="10" r="1.7"/><path d="M4 10h4M6 8v4" stroke="#33829b" stroke-width=".2"/></g><text x="8" y="56" font-size="3">共4片，贴软垫后只压原壳角边。</text><text x="8" y="61" font-size="3">实物按键／接口／屏边先核；不可强压PCB。</text><path d="M12 72h50m-50 -2v4m50 -4v4" stroke="#294550" fill="none" stroke-width=".3"/><text x="24" y="80" font-size="3">本段应为50mm</text></g></svg>