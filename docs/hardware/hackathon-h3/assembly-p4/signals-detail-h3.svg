<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-label="05  H3信号逐线接法 / 不沿用C6引脚"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.pick{cursor:pointer}.pick:hover polygon{stroke:#00876b;stroke-width:3}</style><rect width="1400" height="960" fill="#fffefa"/><text x="32.00" y="34.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="650">BEANLENS  /  HACKATHON H3 /  2026-10-21</text><text x="32.00" y="77.00" font-size="30" fill="#223d38" text-anchor="start" font-weight="650">05  H3信号逐线接法 / 不沿用C6引脚</text><text x="32.00" y="108.00" font-size="16" fill="#62736e" text-anchor="start" font-weight="400">依据ATK-DNK230D V1.0原理图：J10针1=IO25，针2=IO24，针3=IO23，针4=IO22；实物针序先确认。</text><path d="M32.00,127.00 L1368.00,127.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><rect x="45" y="170" width="430" height="220" rx="8" fill="#edf3ef" stroke="#b8c7c1" stroke-width="1.3"/><text x="60.00" y="200.00" font-size="23" fill="#223d38" text-anchor="start" font-weight="650">K230D BOX：J10（2×6）</text><text x="60.00" y="230.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">1脚 GPIO25 / PWM5 →1k→IC 2脚1A</text><text x="60.00" y="257.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">2脚 GPIO24 →1k→关限位NO</text><text x="60.00" y="284.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">3脚 GPIO23 →1k→开限位NO</text><text x="60.00" y="311.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">4脚 GPIO22 →4.7k→NPN基极</text><text x="60.00" y="338.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">J10没有GND或5V；不要凭位置找地</text><text x="60.00" y="365.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">J6口1：2脚GND；其余3针不接</text><rect x="550" y="170" width="420" height="220" rx="8" fill="#edf3ef" stroke="#b8c7c1" stroke-width="1.3"/><text x="565.00" y="200.00" font-size="23" fill="#223d38" text-anchor="start" font-weight="650">SN74AHCT125N，DIP14</text><text x="565.00" y="230.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">14=5V，7=GND，100nF紧贴14/7</text><text x="565.00" y="257.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">2=1A输入；3=1Y→220Ω→舵机信号</text><text x="565.00" y="284.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">1=/OE：10k上拉5V，NPN下拉使能</text><text x="565.00" y="311.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">2脚1A另用10k下拉GND</text><text x="565.00" y="338.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">闲置4/10/13脚接5V（禁能）</text><text x="565.00" y="365.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">闲置5/9/12脚接GND</text><rect x="1040" y="170" width="315" height="220" rx="8" fill="#edf3ef" stroke="#b8c7c1" stroke-width="1.3"/><text x="1055.00" y="200.00" font-size="23" fill="#223d38" text-anchor="start" font-weight="650">2N3904使能</text><text x="1055.00" y="230.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">E→公共GND</text><text x="1055.00" y="257.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">C→IC1脚 /OE</text><text x="1055.00" y="284.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">B←GPIO22经4.7k</text><text x="1055.00" y="311.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">B另经100k→GND</text><text x="1055.00" y="338.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">按厂家图确认E/B/C</text><text x="1055.00" y="365.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">GPIO22=1才传PWM</text><rect x="45" y="455" width="625" height="180" rx="8" fill="#edf3ef" stroke="#b8c7c1" stroke-width="1.3"/><text x="60.00" y="485.00" font-size="23" fill="#223d38" text-anchor="start" font-weight="650">两只限位：固定开关，检测刚性旗片</text><text x="60.00" y="515.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">COM→公共GND；NO→各自GPIO，串1k</text><text x="60.00" y="542.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">GPIO24/23设内部上拉；触发=0，不触发=1</text><text x="60.00" y="569.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">两者同时0、到位超时或状态不合理→FAULT</text><text x="60.00" y="596.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">仅空槽时关闸；卡住不持续加力，不伪报已关</text><rect x="725" y="455" width="630" height="180" rx="8" fill="#edf3ef" stroke="#b8c7c1" stroke-width="1.3"/><text x="740.00" y="485.00" font-size="23" fill="#223d38" text-anchor="start" font-weight="650">板载按键和相机</text><text x="740.00" y="515.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">KEY0 / GPIO34：确认单颗并启动；忙时重复按忽略</text><text x="740.00" y="542.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">KEY1 / GPIO35：软件停止，记录未完成</text><text x="740.00" y="569.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">KEY2 / GPIO0：启动模式相关，保留不用</text><text x="740.00" y="596.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">双GC2093→各自兼容CSI；内置屏；不接C6或UART协议</text><rect x="45" y="655" width="1310" height="45" rx="5" fill="#e3eee6" stroke="#b8c7c1" stroke-width="1.3"/><text x="65.00" y="684.00" font-size="19" fill="#223d38" text-anchor="start" font-weight="400">GPIO25 / PWM5 → 1k → AHCT125的1A / 1Y → 220Ω → MG996R信号；GPIO22只控制NPN使能</text><text x="45.00" y="715.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">缓冲默认/OE为高禁能；GPIO22经NPN控制，5V上拉不会直接进GPIO。输入/输出方向不能反接。</text><text x="45.00" y="748.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">不要用普通74HC125替代AHCT/HCT阈值。舵机PWM为5V，主板GPIO仍3.3V。</text><text x="45.00" y="781.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">先不接舵机，用示波器/逻辑分析仪检查50Hz和禁能，再空载标定端点；几何角−40.706/0不是PWM脉宽。</text><text x="45.00" y="814.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">GPIO25在BOX原理图列PWM5；实机fpioa.help(25)与PWM5可用性仍须核。针1方向按丝印/万用表复核。</text><text x="45.00" y="847.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">KEY1只能在应用正常运行时响应；不称硬件急停，单板卡死后的故障处置需独立电源开关。</text><path d="M32.00,916.00 L1368.00,916.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="32.00" y="942.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="400">单位 mm · 尺寸为设计/布局提案，非孔位加工图；未知元件只画安装占位。按标注尺寸，不量屏幕或缩印图。</text><text x="1368.00" y="942.00" font-size="13" fill="#62736e" text-anchor="end" font-weight="400">05 / 6</text></svg>