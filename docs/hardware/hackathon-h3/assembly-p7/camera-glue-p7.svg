<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#f4f7f9"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#294552"><text x="32" y="45" font-size="27" font-weight="bold">P7 相机直接粘木板：PCB必须竖直，镜头保持水平</text><text x="32" y="80" font-size="16">左相机侧视示意 / 放大非等比例；右侧镜像安装；PCB40×40与镜筒尺寸为参考外形，按实物重核。</text><text x="35" y="133" font-size="21">左外侧 ← X0　　　　　　　　　　　　X40 内边 → 豆路中心X110</text><rect x="80" y="430" width="390" height="60" fill="#d7ae75" stroke="#92734e"/><rect x="80" y="490" width="180" height="55" fill="#293339"/><rect x="453" y="170" width="17" height="260" fill="#28745c"/><rect x="470" y="242" width="67" height="105" fill="#33383c"/><rect x="537" y="256" width="89" height="78" fill="#42494c"/><ellipse cx="626" cy="295" rx="8" ry="38" fill="#224e64"/><path d="M375 430L453 352V430Z" fill="#deb56b" stroke="#b88739"/><path d="M626 295H1040" stroke="#31829d" stroke-width="2" stroke-dasharray="9 7"/><circle cx="1040" cy="295" r="15" fill="#9e9f70"/><text x="690" y="280" font-size="19">水平光轴 Z260 → 目标豆</text><text x="80" y="584" font-size="19">木板：宽40沿X，长200沿Y，厚6；上表面Z240</text><text x="80" y="615" font-size="18">外边与型材齐平；PCB内面约X40，镜头前端约X54.8</text><path d="M225 205H350L452 218M120 350H300L420 392" fill="none" stroke="#69828e" stroke-width="2"/><text x="80" y="195" font-size="19">PCB竖直；底边落木板顶面</text><text x="80" y="338" font-size="19">背面下沿点胶形成胶脚</text><text x="80" y="368" font-size="16">图中为截面；沿前后两个空白区点胶，避开角孔</text><text x="695" y="375" font-size="19">先临时定位 → 双路通图 → 调焦 → 点胶固定</text><text x="695" y="413" font-size="17">胶只接PCB背面下沿空白边的空白边和封边木面。</text><text x="695" y="444" font-size="17">不要粘镜筒、焊盘、接口或堵住散热。</text><text x="695" y="475" font-size="17">胶脚形状仅示意；先在废料上试温度与粘性。</text><text x="695" y="513" font-size="17">没有空白边或粘不稳：先停，换固定点再试。</text><text x="695" y="544" font-size="17">排线另作卸力，不能靠相机胶点承受拉力。</text><text x="32" y="698" font-size="17">两镜头间距参考：165.2 − 54.8 = 110.4mm；相对P6约200mm已缩短，必须重调焦、ROI、短曝光。</text><text x="32" y="730" font-size="14">主机示意 / 不是厂家加工图或已通过的粘接承载试验；电子用胶的材料、使用温度与PCB适用性需核实。</text></g></svg>