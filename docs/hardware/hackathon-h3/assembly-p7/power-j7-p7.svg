<text x="38" y="48" font-size="27" font-weight="bold">H3-P7 · K230D BOX 用J7排针接5V</text><text x="38" y="81" font-size="15">原厂DNK230D V1.0原理图第3页：J7-1=GND，J7-2=VCC_5V；图示为脚号关系，不是实物朝向图</text>
<g fill="white" stroke="#b7cad5" stroke-width="1.5"><rect x="38" y="145" width="260" height="180" rx="6"/><rect x="370" y="145" width="235" height="180" rx="6"/><rect x="700" y="145" width="640" height="420" rx="6"/></g>
<text x="58" y="181" font-size="21">TPS5450候选成品板</text><text x="58" y="216" font-size="18">24V输入 → 调到5.00V</text><text x="58" y="253" font-size="16" fill="#b76b48">OUT+ 5V</text><text x="58" y="292" font-size="16">OUT− GND</text>
<text x="390" y="180" font-size="20">5V正线支路保险</text><text x="390" y="217" font-size="17">2A，匹配直流额定</text><text x="390" y="289" font-size="14">GND直通，不经保险</text>
<text x="726" y="181" font-size="23" font-weight="bold">J7 · 排针引出接口1</text><text x="726" y="213" font-size="15">2×3排针，2.54mm；只接第一排两脚</text>
