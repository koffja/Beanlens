<text x="783" y="294" font-size="19">1 GND</text><text x="1072" y="294" font-size="19">2 +5V</text><text x="783" y="383" font-size="18">3 SPK−：不接</text><text x="1072" y="383" font-size="18">4 SPK+：不接</text><text x="783" y="471" font-size="18">5 ADC_1：不接</text><text x="1072" y="471" font-size="18">6 ADC_0：不接</text>
<text x="726" y="544" font-size="15">方形只提示原理图1脚；插接前按实物丝印／方焊盘和万用表确认方向</text>
<text x="38" y="610" font-size="20" font-weight="bold">接线对象与检查顺序</text>
<text x="38" y="647" font-size="17">① 断开BOX、USB和灯支路，先测降压输出5.00V与极性。</text>
<text x="38" y="684" font-size="17">② 确认J7-1与板上GND导通；J7-2对应VCC_5V。其余四脚留空并绝缘。</text>
<text x="38" y="721" font-size="17">③ 5V正线经2A保险到J7-2；GND到J7-1。用22AWG短线和匹配2.54mm母接头，核端子电流规格。</text>
<text x="38" y="758" font-size="17">④ 上电测J7处电压、启动峰值、接头温升，再接双摄并观察重启／压降；异常先断电排查。</text>
<rect x="38" y="791" width="1302" height="99" fill="#fff4db"/><text x="57" y="824" font-size="18" font-weight="bold">J7外部5V与Type-C1供电二选一</text><text x="57" y="857" font-size="16">用Type-C1连接CanMV IDE前，先拔掉J7供电。Type-C2仅USB串口且不供电，功能与Type-C1不同。</text>
<text x="38" y="928" font-size="15">J7直接接VCC_5V，绕过VBUS→U5 MT9700输入限流路径；2A外部保险为试制起点，不能替代稳压、极性或接头验收。</text><text x="38" y="966" font-size="14" fill="#627d8b">来源：ATK-DNK230D V1.0.pdf 第1页与第3页，SHA-256 caa406fe…；只做原理图核对，未实物通电验证。</text>
</g></svg>
