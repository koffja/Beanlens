<svg xmlns="http://www.w3.org/2000/svg" width="115mm" height="190mm" viewBox="0 0 115 190"><rect width="115" height="190" fill="white"/><g font-family="sans-serif" fill="#294550"><text x="8" y="9" font-size="4">H3-P7 · L01-front 灯角铝20宽平面翼</text><text x="8" y="15" font-size="3">单位mm；100%实际尺寸；量50mm标尺后先对实物</text><g transform="translate(12 22)" fill="none" stroke="#294550" stroke-width=".3"><rect width="20" height="120"/><circle cx="10" cy="112" r="1.7"/><path d="M8 112h4M10 110v4" stroke="#33829b" stroke-width=".2"/><circle cx="10" cy="104" r="1.7"/><path d="M8 104h4M10 102v4" stroke="#33829b" stroke-width=".2"/></g><text x="8" y="157" font-size="3">共4件长120，另一翼见L01-return；本翼粘灯带，不另加孔。</text><text x="8" y="162" font-size="3">纸底Z186，灯带206到306，留开螺母；右侧回折翼朝外。</text><path d="M12 177h50m-50 -2v4m50 -4v4" stroke="#294550" fill="none" stroke-width=".3"/><text x="24" y="185" font-size="3">本段应为50mm</text></g></svg>