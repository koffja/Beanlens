<svg xmlns="http://www.w3.org/2000/svg" width="224mm" height="100mm" viewBox="0 0 224 100"><rect width="224" height="100" fill="white"/><g font-family="sans-serif" fill="#294550"><text x="8" y="9" font-size="4">H3-P5 · W05 相机板200×30</text><text x="8" y="15" font-size="3">单位mm；100%实际尺寸；量50mm标尺后先对实物</text><g transform="translate(12 22)" fill="none" stroke="#294550" stroke-width=".3"><rect width="200" height="30"/><circle cx="10" cy="15" r="1.7"/><path d="M8 15h4M10 13v4" stroke="#33829b" stroke-width=".2"/><circle cx="74" cy="15" r="1.7"/><path d="M72 15h4M74 13v4" stroke="#33829b" stroke-width=".2"/><circle cx="126" cy="15" r="1.7"/><path d="M124 15h4M126 13v4" stroke="#33829b" stroke-width=".2"/><circle cx="190" cy="15" r="1.7"/><path d="M188 15h4M190 13v4" stroke="#33829b" stroke-width=".2"/></g><text x="8" y="67" font-size="3">纸横向＝全局Y20→220；纵向＝全局X-18→12。</text><text x="8" y="72" font-size="3">两端孔在10/190，中间脚孔74/126；全在短边中线15。</text><text x="8" y="77" font-size="3">相机座原件转90°，板顶Z240；按外形先试摆。</text><path d="M12 87h50m-50 -2v4m50 -4v4" stroke="#294550" fill="none" stroke-width=".3"/><text x="24" y="95" font-size="3">本段应为50mm</text></g></svg>