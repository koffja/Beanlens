<text x="36" y="590" font-size="17" font-weight="bold">接线顺序</text><text x="36" y="621" font-size="15">① 断电核极性 → ② 降压空载量5.00V → ③ 成品USB线供BOX → ④ 断电插CSI → ⑤ 核双路图像后手投一颗。</text>
<text x="36" y="661" font-size="15">相机通过兼容CSI接口供电，不接24V。0.75mm²电源线配压接端子；大电流不走杜邦，USB与主板电源针不并联供电。</text>
<text x="36" y="701" font-size="15">本版不装UBEC、AHCT125、2N3904、外接限位或独立传感器；GPIO25/24/23/22没有本版执行器接线。</text>
<text x="36" y="741" font-size="15">KEY1只让软件停止采集许可并提示人停投，不能阻挡已下落的豆。缺图／糊图记录待复核，不能算正常颗。</text>
<text x="36" y="784" font-size="13" fill="#627d8b">26.75W＝5V×3A÷0.8＋灯8W，仅预算；电压、接口、电流、保险与温升须实测。图中保险沿用原低压配电包。</text>
