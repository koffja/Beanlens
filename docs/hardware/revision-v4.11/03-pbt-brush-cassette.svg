<text x="48" y="55" class="" style="font-size:16px;fill:#477d67">BEANLENS / V4.11 / 03</text>
<text x="48" y="108" class="" style="font-size:36px">PBT刷在五槽入口，夹在可拆刷盒里，不塞进10mm下座</text>
<text x="48" y="148" class="" style="font-size:19px;fill:#667c71">五槽分道片从上座顶 Z298.3 向上延伸到 Z318.3。前后各5段轻刷，刷根在斗外，刷毛经小槽伸入。</text>
<text x="48" y="200" class="" style="font-size:22px">从正面看五槽 / 前排刷根位置（后排相同）</text>
