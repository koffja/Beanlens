<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-label="06  按BOM组装的顺序与连接件核对"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.pick{cursor:pointer}.pick:hover polygon{stroke:#00876b;stroke-width:3}</style><rect width="1400" height="960" fill="#fffefa"/><text x="32.00" y="34.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="650">BEANLENS  /  ASSEMBLY V4.8 INSET /  2026-10-16</text><text x="32.00" y="77.00" font-size="30" fill="#223d38" text-anchor="start" font-weight="650">06  按BOM组装的顺序与连接件核对</text><text x="32.00" y="108.00" font-size="16" fill="#62736e" text-anchor="start" font-weight="400">先机架与手推机械，再空载动作与成像，最后称重/面板。图纸检查不代替实机联调。</text><path d="M32.00,127.00 L1368.00,127.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><rect x="40" y="155" width="1320" height="38" rx="0" fill="#edf3ef" stroke="#b8c7c1" stroke-width="1.3"/><text x="49.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">步骤</text><text x="119.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">装配对象 / BOM</text><text x="489.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">操作与检查</text><path d="M40.00,193.00 L1360.00,193.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="215.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">1</text><text x="119.00" y="215.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">F01 / F02：T01–T12主框架</text><text x="489.00" y="215.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">连续立柱与上下框松装；量外宽220/深240/高460与两面对角线，先轻锁。</text><path d="M40.00,231.00 L1360.00,231.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="253.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">2</text><text x="119.00" y="253.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">T13–T16中框＋Q01–Q04顶托片</text><text x="489.00" y="253.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">中框顶324；顶框内侧M5锁金属托片，承托PP顶法兰Z440，不装木斗。</text><path d="M40.00,269.00 L1360.00,269.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="291.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">3</text><text x="119.00" y="291.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">F04主斗 / F14双法兰 / F05小斗</text><text x="489.00" y="291.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">按V4.8实料外线裁切、斜接试焊；密封层0.8名义，小斗高24.9；不混旧模板。</text><path d="M40.00,307.00 L1360.00,307.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="329.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">4</text><text x="119.00" y="329.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">G06 / G11 / G12 / G07–G10滑架</text><text x="489.00" y="329.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">先装导轨、转接、支承与闸片；不接舵机，手推15mm不偏摆不卡滞。</text><path d="M40.00,345.00 L1360.00,345.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="367.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">5</text><text x="119.00" y="367.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">A03 / G01–G05 / G14 / S01</text><text x="489.00" y="367.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">装支架与短杆，核花键/孔深/摆角；独立6V空载标定限位，启动不自动开闸。</text><path d="M40.00,383.00 L1360.00,383.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="405.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">6</text><text x="119.00" y="405.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">T17/T18 / B13 / B01 / L02 / PH04</text><text x="489.00" y="405.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">相机固定独立梁；75起试，标尺检120视宽；灯与光电开关对照图像。</text><path d="M40.00,421.00 L1360.00,421.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="443.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">7</text><text x="119.00" y="443.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">W06 / W01 / W05 / B12</text><text x="489.00" y="443.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">组件资料确认后装；盒、活动台、线缆不得碰外壳；称稳定再报重。</text><path d="M40.00,459.00 L1360.00,459.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="481.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">8</text><text x="119.00" y="481.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">F06电控 / A08 / A17 / P05 / P06</text><text x="489.00" y="481.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">先不接负载量5V/6V；信号与舵机电流分开走；留排线应力释放。</text><path d="M40.00,497.00 L1360.00,497.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="519.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">9</text><text x="119.00" y="519.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">P01–P09 / F11 / F07</text><text x="489.00" y="519.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">板块内嵌，三面下延；前按钮中心273；检查后板/固定托板与豆盒不相碰。</text><path d="M40.00,535.00 L1360.00,535.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="557.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">10</text><text x="119.00" y="557.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">单槽 → 五槽联调</text><text x="489.00" y="557.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">从少量豆开始；观察夹豆/飞豆/残流/偏转；卡豆停机排障，不持续硬关。</text><path d="M40.00,573.00 L1360.00,573.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="40.00" y="618.00" font-size="21" fill="#223d38" text-anchor="start" font-weight="650">连接件清点 / 本次BOM补充</text><rect x="40" y="640" width="1320" height="36" rx="0" fill="#edf3ef" stroke="#b8c7c1" stroke-width="1.3"/><text x="49.00" y="662.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="650">BOM</text><text x="194.00" y="662.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="650">使用数量</text><text x="594.00" y="662.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="650">购买/核对事项</text><path d="M40.00,676.00 L1360.00,676.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="698.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">F02</text><text x="194.00" y="698.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">角码28用；配套M5/T螺母各56用</text><text x="594.00" y="698.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">购32角码、64螺钉/64 T螺母；只计骨架，另列F11面板/F13斗支承。</text><path d="M40.00,712.00 L1360.00,712.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="734.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">F11</text><text x="194.00" y="734.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">木板32点＋前遮光条2点</text><text x="594.00" y="734.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">40套内角片/M5/T螺母/M3×25/隔距；角样先核1mm内凹和2mm边缝。</text><path d="M40.00,748.00 L1360.00,748.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="770.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">F13 / F14</text><text x="194.00" y="770.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">4顶托片＋4接头螺栓</text><text x="594.00" y="770.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">顶法兰M3×12候选；接头M3×16＋限压垫；F08旧木斗固定取消。</text><path d="M40.00,784.00 L1360.00,784.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="806.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">B13 / G15–G18</text><text x="194.00" y="806.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">相机支架/滑块/导轨/限位各自独立</text><text x="594.00" y="806.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">按各行数量；安装M5件随B13套件核对。不能把相机孔距、限位孔距混用。</text><path d="M40.00,820.00 L1360.00,820.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="842.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">未逐件画出</text><text x="194.00" y="842.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">电阻、电容、线缆、保险备件、砝码等</text><text x="594.00" y="842.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">完整采购仍以V4.8表为准；互斥工业光电/称重备选没有同时画入整机。</text><path d="M40.00,856.00 L1360.00,856.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><path d="M32.00,916.00 L1368.00,916.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="32.00" y="942.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="400">单位 mm · 尺寸为设计/布局提案，非孔位加工图；未知元件只画安装占位。按标注尺寸，不量屏幕或缩印图。</text><text x="1368.00" y="942.00" font-size="13" fill="#62736e" text-anchor="end" font-weight="400">06 / 10</text></svg>