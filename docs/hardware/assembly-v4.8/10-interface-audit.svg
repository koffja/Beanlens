<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-label="10  遗漏项与加工前接口检查"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.pick{cursor:pointer}.pick:hover polygon{stroke:#00876b;stroke-width:3}</style><rect width="1400" height="960" fill="#fffefa"/><text x="32.00" y="34.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="650">BEANLENS  /  ASSEMBLY V4.8 INSET /  2026-10-16</text><text x="32.00" y="77.00" font-size="30" fill="#223d38" text-anchor="start" font-weight="650">10  遗漏项与加工前接口检查</text><text x="32.00" y="108.00" font-size="16" fill="#62736e" text-anchor="start" font-weight="400">新增部件编号与BOM对应；占位、设计尺寸、原厂外形与实物待核项分别说明。</text><path d="M32.00,127.00 L1368.00,127.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><rect x="40" y="155" width="1320" height="58" rx="0" fill="#edf3ef" stroke="#b8c7c1" stroke-width="1.3"/><text x="49.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">项目</text><text x="274.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">V4.8处理</text><text x="844.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">仍需实物确认</text><path d="M40.00,213.00 L1360.00,213.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="235.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">双屏</text><text x="274.00" y="235.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">拆出整机、内置显示面、压框、后托框及服务腔</text><text x="844.00" y="235.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">BOX突出物/夹片避口；C6有效区基准、M2牙深/天线</text><path d="M40.00,271.00 L1360.00,271.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="293.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">料斗承重</text><text x="274.00" y="293.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">取消6木件，四金属托片支承PP3顶法兰</text><text x="844.00" y="293.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">PP蠕变、支点挠曲、1kg分级静载；容积仍约1.15L</text><path d="M40.00,329.00 L1360.00,329.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="351.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">PP切料/焊筋</text><text x="274.00" y="351.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">内外面尺寸、端部/角部斜接、4焊筋限界</text><text x="844.00" y="351.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">厚度实测、接缝0–0.2目标、熔合/翘曲和清洁</text><path d="M40.00,387.00 L1360.00,387.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="409.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">可拆接头</text><text x="274.00" y="409.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">PP3双法兰＋1mm硅胶名义压0.8，M3×16</text><text x="844.00" y="409.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">密封圈资料、压缩/限压垫与上下口无错台</text><path d="M40.00,445.00 L1360.00,445.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="467.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">闸片传动</text><text x="274.00" y="467.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">G09角梁与G10居中耳单独画出</text><text x="844.00" y="467.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">孔高、球头摆角、花键、舵机支架、全行程扫掠</text><path d="M40.00,503.00 L1360.00,503.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="525.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">后罩/润滑隔离</text><text x="274.00" y="525.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">G20明确画为未完成接口，不能当封闭罩</text><text x="844.00" y="525.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">退片窄缝、侧封/清理路径、机械端点与卡豆卸力</text><path d="M40.00,561.00 L1360.00,561.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="583.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">相机/灯/光电</text><text x="274.00" y="583.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">沿用拟定位置与包络</text><text x="844.00" y="583.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">实际PCB、镜头长度/近焦、灯切点、视锥/IR干扰</text><path d="M40.00,619.00 L1360.00,619.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="641.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">称台/电源</text><text x="274.00" y="641.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">独立力路，电控托板只作安装边界</text><text x="844.00" y="641.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">HJ-AZ4高度/接口与旁路，DC模块实物尺寸/温升</text><path d="M40.00,677.00 L1360.00,677.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="699.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">线束/检修</text><text x="274.00" y="699.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">两屏服务腔与TF/USB可达要求补充</text><text x="844.00" y="699.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">线长/弯曲半径、应力释放、空气流通；图未验散热</text><path d="M40.00,735.00 L1360.00,735.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="757.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">加工放行</text><text x="274.00" y="757.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">可先练焊/纸样/角样；标准件按BOM核</text><text x="844.00" y="757.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">防护/孔位待核项完成前，不带豆电动联调</text><path d="M40.00,793.00 L1360.00,793.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="40.00" y="835.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">实物未知项保留为明确的装配条件；本次完成的是可审查设计与文档校核，没有上板/承重/焊接验收。</text><text x="40.00" y="875.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="650">型材仍18根：460×4、200×6、180×8；只补同槽型黑色180×4；木板仅600方9片。</text><path d="M32.00,916.00 L1368.00,916.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="32.00" y="942.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="400">单位 mm · 尺寸为设计/布局提案，非孔位加工图；未知元件只画安装占位。按标注尺寸，不量屏幕或缩印图。</text><text x="1368.00" y="942.00" font-size="13" fill="#62736e" text-anchor="end" font-weight="400">10 / 10</text></svg>