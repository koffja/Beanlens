nt-size="17" fill="#223d38" text-anchor="start" font-weight="400">孔位用实物确认，尤其C6有效区与M2孔基准。</text><text x="40.00" y="875.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">已有800板继续使用即可；不再额外买料斗木板。所有净尺寸均需另计锯缝。</text><path d="M32.00,916.00 L1368.00,916.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="32.00" y="942.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="400">单位 mm · 尺寸为设计/布局提案，非孔位加工图；未知元件只画安装占位。按标注尺寸，不量屏幕或缩印图。</text><text x="1368.00" y="942.00" font-size="13" fill="#62736e" text-anchor="end" font-weight="400">03 / 10</text></svg>