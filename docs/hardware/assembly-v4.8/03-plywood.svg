" text-anchor="start" font-weight="400">176×58</text><path d="M40.00,763.00 L568.00,763.00" fill="none" stroke="#cb8351" stroke-width="1.5"/><path d="M40.00,758.00 L40.00,768.00" fill="none" stroke="#cb8351" stroke-width="1.5"/><path d="M568.00,758.00 L568.00,768.00" fill="none" stroke="#cb8351" stroke-width="1.5"/><text x="304.00" y="755.00" font-size="16" fill="#cb8351" text-anchor="middle" font-weight="650">600</text><rect x="630" y="155" width="730" height="38" rx="0" fill="#edf3ef" stroke="#b8c7c1" stroke-width="1.3"/><text x="639.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">编号</text><text x="779.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">净宽×高 / 厚6</text><text x="1039.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">位置</text><path d="M630.00,193.00 L1360.00,193.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="639.00" y="215.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">P01/P02</text><text x="779.00" y="215.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">176×112，各1</text><text x="1039.00" y="215.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">前/后上Z326–438</text><path d="M630.00,231.00 L1360.00,231.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="639.00" y="253.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">P03/P04</text><text x="779.00" y="253.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">196×112，各1</text><text x="1039.00" y="253.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">左/右上Z326–438</text><path d="M630.00,269.00 L1360.00,269.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="639.00" y="291.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">P05/P06</text><text x="779.00" y="291.00" font-size="16" fill="#223d38" text-anchor="start" font-weight=