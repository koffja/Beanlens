<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-label="03  九块内嵌木外壳与裁切排版"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.pick{cursor:pointer}.pick:hover polygon{stroke:#00876b;stroke-width:3}</style><rect width="1400" height="960" fill="#fffefa"/><text x="32.00" y="34.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="650">BEANLENS  /  ASSEMBLY V4.8 INSET /  2026-10-16</text><text x="32.00" y="77.00" font-size="30" fill="#223d38" text-anchor="start" font-weight="650">03  九块内嵌木外壳与裁切排版</text><text x="32.00" y="108.00" font-size="16" fill="#62736e" text-anchor="start" font-weight="400">取消PP外侧木斗，释放双屏接线空间；PP斗的载荷改由顶框金属托片承担。</text><path d="M32.00,127.00 L1368.00,127.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="40.00" y="163.00" font-size="20" fill="#223d38" text-anchor="start" font-weight="650">F03：600×600×6一张 / 仅9块外壳；取消木斗和木托耳</text><rect x="40" y="210" width="528.0" height="528.0" rx="0" fill="#f6eddf" stroke="#b8c7c1" stroke-width="1.3"/><rect x="42.64" y="212.64" width="172.48" height="246.4" rx="0" fill="#d5b58a" stroke="#223d38" stroke-width="1.3"/><text x="47.64" y="229.64" font-size="12" fill="#223d38" text-anchor="start" font-weight="400">P05</text><text x="47.64" y="245.64" font-size="11" fill="#223d38" text-anchor="start" font-weight="400">196×280</text><rect x="42.64" y="461.68" width="172.48" height="98.56" rx="0" fill="#d5b58a" stroke="#223d38" stroke-width="1.3"/><text x="47.64" y="478.68" font-size="12" fill="#223d38" text-anchor="start" font-weight="400">P03</text><text x="47.64" y="494.68" font-size="11" fill="#223d38" text-anchor="start" font-weight="400">196×112</text><rect x="217.76" y="212.64" width="172.48" height="246.4" rx="0" fill="#d5b58a" stroke="#223d38" stroke-width="1.3"/><text x="222.76" y="229.64" font-size="12" fill="#223d38" text-anchor="start" font-weight="400">P06</text><text x="222.76" y="245.64" font-size="11" fill="#223d