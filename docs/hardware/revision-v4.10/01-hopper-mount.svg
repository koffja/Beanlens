<rect x="744" y="190" width="704" height="177" rx="8" fill="#eaf3ea" stroke="#c6d6ca" stroke-width="2"/>
<text x="760" y="221" class="bold" style="font-size:23px">装配顺序</text>
<text x="760" y="251" class="" style="font-size:18px">① M5/T螺母把4只金属托片锁在顶框内侧槽。</text>
<text x="760" y="278" class="" style="font-size:18px">② 焊好的PP斗连顶托环从上方放下，坐在4托片上。</text>
<text x="760" y="305" class="" style="font-size:18px">③ 4颗M3穿长孔固定；量平整、检查焊筋和屏幕间隙。</text>
<text x="760" y="332" class="" style="font-size:18px">④ 最后接闸片/连杆；焊接和承重不靠木外壳。</text>
<rect x="744" y="750" width="704" height="218" rx="8" fill="#fff" stroke="#c6d6ca" stroke-width="2"/>
<text x="760" y="781" class="bold" style="font-size:23px">力是这样传的</text>
<text x="760" y="811" class="" style="font-size:18px">上斗 → PP焊缝 → PP3托环</text>
<text x="760" y="838" class="" style="font-size:18px">→ 4只金属托片 → M5/T螺母 → 黑2020框。</text>
<text x="760" y="865" class="" style="font-size:18px">托片由25×25×2角铝裁制，竖脚22 / 横脚14。</text>
<text x="760" y="892" class="" style="font-size:18px">M3槽补偿装配偏差，不能靠松螺丝消除晃动。</text>
<text x="760" y="919" class="" style="font-size:18px">PP蠕变、焊缝拉脱和托片转动还要做静载试验。</text>
<text x="760" y="946" class="" style="font-size:18px">下槽盒另由G21/G11定位，禁止上下硬拉找平。</text>
<polyline class="wire" points="48,1000 1452,1000" stroke="#d3ded4"/>
<text x="48" y="1030" class="" style="font-size:16px">2026-10-16 · 方案尺寸，非实物验收 · 先试焊 / 手推 / 无刷与带刷单槽对照，再五槽联调</text>
<text x="1390" y="1030" class="" style="font-size:16px">1 / 5</text>
</svg>