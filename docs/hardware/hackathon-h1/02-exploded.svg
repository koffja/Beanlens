size="15" fill="#223d38" text-anchor="start" font-weight="400">C01–03 / H13</text><text x="904.00" y="221.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">PP3槽底24×60；两侧片兼下支承；35°起试</text><path d="M670.00,243.00 L1360.00,243.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="679.00" y="265.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">B01 / H13</text><text x="904.00" y="265.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">80×110×3底座；开40×40落豆孔</text><path d="M670.00,287.00 L1360.00,287.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="679.00" y="309.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">S01/S02 / H03/H10</text><text x="904.00" y="309.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">MG996R固定；轴竖直，目标(140,126,240)</text><path d="M670.00,331.00 L1360.00,331.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="679.00" y="353.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">S03/S04 / H11/H12</text><text x="904.00" y="353.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">25T直臂16mm孔 → 小角铝 → 轻PP挡片</text><path d="M670.00,375.00 L1360.00,375.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="679.00" y="397.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">S05 / H13</text><text x="904.00" y="397.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">挡片46×18×3，关闭挡出口，向后侧摆90°</text><path d="M670.00,419.00 L1360.00,419.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="679.00" y="441.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">S06 / H13</text><text x="904.00" y="441.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">刚性旗片跟随挡片，2固定微动开关检测</text><path d="M670.00,463.00 L1360.00,463.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="679.00" y="485.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">L01/L02 / H09</text><text x="904.00" y="485.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">开关限位NO接地；未触发上拉；检测真实摆片</text><path d="M670.00,507.00 L1360.00,507.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="679.00" y="529.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">CAM / H02</text><text x="904.00" y="529.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">光轴(110,112)，镜头Z320起试，调焦后定孔</text><path d="M670.00,551.00 L1360.00,551.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="680.00" y="585.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">豆在固定斜槽末端靠挡片停住，拍摄时舵机不动作。</text><text x="680.00" y="618.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">单颗、双手移开后按KEY0；结果保存后再开闸放走。</text><text x="680.00" y="651.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">空槽确认后才关闸，避免以缓关代替卡豆防护。</text><text x="680.00" y="684.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">本版无双球头杆、直线导轨、长横梁、大PP料斗。</text><text x="680.00" y="717.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">90°仅几何演示；真实PWM端点与超时须空载标定。</text><text x="680.00" y="750.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">轴偏置、角件孔位和限位碰轮高度按实物试配。</text><text x="680.00" y="783.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">相机/支架毛坯不是厂家孔位图；先纸样再钻孔。</text><path d="M32.00,916.00 L1368.00,916.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="32.00" y="942.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="400">单位 mm · 尺寸为设计/布局提案，非孔位加工图；未知元件只画安装占位。按标注尺寸，不量屏幕或缩印图。</text><text x="1368.00" y="942.00" font-size="13" fill="#62736e" text-anchor="end" font-weight="400">02 / 6</text></svg>