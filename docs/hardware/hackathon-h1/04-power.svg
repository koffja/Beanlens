<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1060" role="img" aria-label="先分出三路电压，再分别接回负极" width="1400" height="960">
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#233b38;font-size:21px} .small{font-size:18px}.tiny{font-size:16px}.title{font-size:37px;font-weight:700}.bold{font-weight:700} .wire{fill:none;stroke-linejoin:round;stroke-linecap:round;stroke-width:4}</style>
<rect width="1500" height="1060" fill="#fafbf7" />
<text x="48" y="56" class="" style="font-size:16px;fill:#47786b">BEANLENS / HACKATHON H1 / 04</text>
<text x="48" y="110" class="" style="font-size:37px">先分出三路电压，再分别接回负极</text>
<text x="48" y="148" class="" style="font-size:19px;fill:#657a73">橙24V、红5V、紫6V、黑返回；蓝虚线为缓冲后信号。跨桥不连接，圆点才是接点。</text>
<rect x="48" y="190" width="280" height="125" rx="10" fill="#fff" stroke="#c8d6ce" stroke-width="2" />
<text x="65" y="222" class="bold" style="font-size:23px">H04 外置适配器</text>
<text x="65" y="252" class="" style="font-size:18px">YU2405（用户指定型号）</text>
<text x="65" y="279" class="" style="font-size:18px">24V / 5A / 120W</text>
<text x="48" y="345" class="" style="font-size:18px">成品带开关插排 → 成品交流线</text>
<text x="48" y="373" class="" style="font-size:18px">220V 留在机外；总开关在插排</text>
<text x="48" y="401" class="" style="font-size:18px">H29 插头尺寸与中心正负先实测</text>
<polyline class="wire" data-rail="24" points="328,229 358,229" stroke="#c56b13" />
<rect x="358" y="208" width="104" height="42" rx="4" fill="#fff2df" stroke="#c56b13" stroke-width="2" />
<text x="369" y="236" class="" style="font-size:19px">主 4A</text>
<polyline class="wire" data-rail="24" points="462,229 510,229 510,722" stroke="#c56b13" />
<polyline class="wire" data-rail="ground" points="328,275 477,275 477,768" stroke="#273843" />
<text x="346" y="301" class="" style="font-size:18px">0V</text>
<text x="495" y="191" class="" style="font-size:17px;fill:#c56b13">24V+ 分线</text>
<text x="389" y="820" class="" style="font-size:17px">24V 返回</text>
<circle cx="510" cy="229" r="5" fill="#c56b13" />
<polyline class="wire" data-rail="24" points="510,229 550,229" stroke="#c56b13" />
<rect x="550" y="207" width="155" height="44" rx="4" fill="#fff2df" stroke="#c56b13" stroke-width="2" />
<text x="560" y="236" class="" style="font-size:18px">灯 1A</text>
<polyline class="wire" data-rail="24" points="705,229 750,229" stroke="#c56b13" />
<circle cx="477" cy="275" r="5" fill="#273843" />
<path d="M477 275 H498 Q510 255 522 275 H750" fill="none" stroke="#fafbf7" stroke-width="11" />
<path d="M477 275 H498 Q510 255 522 275 H750" class="wire" data-rail="ground" stroke="#273843" />
<rect x="750" y="196" width="640" height="130" rx="10" fill="#fff6e9" stroke="#c8d6ce" stroke-width="2" />
<text x="767" y="228" class="bold" style="font-size:23px">24V 灯带</text>
<text x="767" y="258" class="" style="font-size:18px">H07 共0.2m，预算 ≤4W</text>
<text x="767" y="285" class="" style="font-size:18px">正接 +，负接 −</text>
<text x="717" y="217" class="" style="font-size:20px;fill:#c56b13">+</text>
<text x="717" y="301" class="" style="font-size:20px">−</text>
<circle cx="510" cy="470" r="5" fill="#c56b13" />
<polyline class="wire" data-rail="24" points="510,470 550,470" stroke="#c56b13" />
<rect x="550" y="448" width="155" height="44" rx="4" fill="#fff2df" stroke="#c56b13" stroke-width="2" />
<text x="560" y="477" class="" style="font-size:18px">5V 输入1.5A</text>
<polyline class="wire" data-rail="24" points="705,470 750,470" stroke="#c56b13" />
<circle cx="477" cy="516" r="5" fill="#273843" />
<path d="M477 516 H498 Q510 496 522 516 H750" fill="none" stroke="#fafbf7" stroke-width="11" />
<path d="M477 516 H498 Q510 496 522 516 H750" class="wire" data-rail="ground" stroke="#273843" />
<rect x="750" y="428" width="290" height="160" rx="10" fill="#f0f5ef" stroke="#c8d6ce" stroke-width="2" />
<text x="767" y="460" class="bold" style="font-size:23px">H05 TPS5450候选</text>
<text x="767" y="490" class="" style="font-size:18px">5.00V，整板SKU待核</text>
<text x="767" y="517" class="" style="font-size:18px">给BOX与缓冲板，共≤3A</text>
<text x="717" y="460" class="" style="font-size:16px;fill:#c56b13">IN+</text>
<text x="716" y="542" class="" style="font-size:16px">IN−</text>
<text x="1048" y="458" class="" style="font-size:16px;fill:#c4323d">OUT+</text>
<text x="1048" y="541" class="" style="font-size:16px">OUT−</text>
<polyline class="wire" data-rail="5" points="1040,470 1110,470" stroke="#c4323d" />
<polyline class="wire" data-rail="ground" points="1040,516 1110,516" stroke="#273843" />
<text x="1110" y="407" class="" style="font-size:18px;fill:#c4323d">独立5V支路</text>
<rect x="1110" y="428" width="340" height="166" rx="10" fill="#fff" stroke="#c8d6ce" stroke-width="2" />
<text x="1127" y="460" class="bold" style="font-size:23px">H29 5V分线</text>
<text x="1127" y="490" class="" style="font-size:18px">成品USB-A → C短线</text>
<text x="1127" y="517" class="" style="font-size:18px">→ BOX Type-C1 电源口</text>
<text x="1127" y="544" class="" style="font-size:18px">辅助5V/GND → AHCT缓冲板</text>
<text x="1127" y="571" class="" style="font-size:18px">无C6、称重、对射支路</text>
<text x="1110" y="625" class="" style="font-size:17px;fill:#c4323d">5V仅给BOX/缓冲，禁接6V</text>
<circle cx="510" cy="722" r="5" fill="#c56b13" />
<polyline class="wire" data-rail="24" points="510,722 550,722" stroke="#c56b13" />
<rect x="550" y="700" width="155" height="44" rx="4" fill="#fff2df" stroke="#c56b13" stroke-width="2" />
<text x="560" y="729" class="" style="font-size:18px">6V 输入 3A</text>
<polyline class="wire" data-rail="24" points="705,722 750,722" stroke="#c56b13" />
<circle cx="477" cy="768" r="5" fill="#273843" />
<polyline class="wire" data-rail="ground" points="477,768 750,768" stroke="#273843" />
<rect x="750" y="680" width="290" height="160" rx="10" fill="#f0f5ef" stroke="#c8d6ce" stroke-width="2" />
<text x="767" y="712" class="bold" style="font-size:23px">H06 UBEC 5A</text>
<text x="767" y="742" class="" style="font-size:18px">30607000，先确认6V跳帽</text>
<text x="767" y="769" class="" style="font-size:18px">目标 3A 连续 / 5A 短峰</text>
<text x="717" y="712" class="" style="font-size:16px;fill:#c56b13">IN+</text>
<text x="716" y="794" class="" style="font-size:16px">IN−</text>
<text x="1048" y="710" class="" style="font-size:16px;fill:#7b45b5">OUT+</text>
<text x="1048" y="793" class="" style="font-size:16px">OUT−</text>
<polyline class="wire" data-rail="6" points="1040,722 1110,722" stroke="#7b45b5" />
<polyline class="wire" data-rail="ground" points="1040,768 1110,768" stroke="#273843" />
<text x="1110" y="670" class="" style="font-size:18px;fill:#7b45b5">独立6V支路</text>
<rect x="1110" y="680" width="340" height="137" rx="10" fill="#fff" stroke="#c8d6ce" stroke-width="2" />
<text x="1127" y="712" class="bold" style="font-size:23px">H28 6V开关→MG996R</text>
<text x="1127" y="742" class="" style="font-size:18px">正接舵机 V+，负接舵机 GND</text>
<text x="1127" y="769" class="" style="font-size:18px">H26 1000µF/16V就近并联</text>
<text x="1110" y="850" class="" style="font-size:18px;fill:#7b45b5">不能从BOX板脚给舵机供电</text>
<rect x="48" y="461" width="370" height="142" rx="10" fill="#eaf2ee" stroke="#c8d6ce" stroke-width="2" />
<text x="65" y="493" class="bold" style="font-size:23px">共地不是混接正极</text>
<text x="65" y="523" class="" style="font-size:18px">两块降压为非隔离型，已有共同参考。</text>
<text x="65" y="550" class="" style="font-size:18px">负载负线分别回各自 OUT−。</text>
<text x="65" y="577" class="" style="font-size:18px">5V+、6V+、24V+ 绝不互相相连。</text>
<rect x="48" y="634" width="370" height="140" rx="10" fill="#fff" stroke="#c8d6ce" stroke-width="2" />
<text x="65" y="666" class="bold" style="font-size:23px">电源能力按整块模块验收</text>
<text x="65" y="696" class="" style="font-size:18px">输入电容 / 散热按整板工况核。</text>
<text x="65" y="723" class="" style="font-size:18px">芯片5A不是整板5A的承诺。</text>
<text x="65" y="750" class="" style="font-size:18px">电容不能代替降压模块的供电能力。</text>
<rect x="799" y="614" width="270" height="46" rx="6" fill="#e9f2f7" stroke="#1777ae" stroke-width="2" />
<text x="812" y="644" class="" style="font-size:18px">BOX → H22 PWM缓冲</text>
<polyline class="wire" data-rail="signal" points="1069,637 1090,637 1090,650 1466,650 1466,855 1270,855 1270,817" stroke="#1777ae" stroke-dasharray="9 7" />
<text x="820" y="891" class="" style="font-size:16px">BOX GPIO25/PWM5 → H22 3.3/5V缓冲 → 舵机信号（50Hz，见第5页）</text>
<text x="48" y="936" class="" style="font-size:21px">功率预算：持续45.25W / 短峰60.25W（两路降压按80%）→ 24V/5A；仍须实测温升与压降。</text>
<text x="48" y="973" class="" style="font-size:18px">保险均装正线上、靠近分支起点；保险保护线路，不负责卡豆停止。停止、复位与限位仍按固件验收要求执行。</text>
<polyline class="wire" data-rail="" points="48,1000 1452,1000" stroke="#d2ddd6" />
<text x="48" y="1030" class="" style="font-size:16px">2026-10-19 · H1设计方案，尚未电气/机械验收 · 按端子标识核线，不按图中物理位置猜接</text>
<text x="1390" y="1030" class="" style="font-size:16px">4 / 6</text>
</svg>