<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-label="06  比赛验收顺序与运行状态"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.pick{cursor:pointer}.pick:hover polygon{stroke:#00876b;stroke-width:3}</style><rect width="1400" height="960" fill="#fffefa"/><text x="32.00" y="34.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="650">BEANLENS  /  HACKATHON H1 /  2026-10-19</text><text x="32.00" y="77.00" font-size="30" fill="#223d38" text-anchor="start" font-weight="650">06  比赛验收顺序与运行状态</text><text x="32.00" y="108.00" font-size="16" fill="#62736e" text-anchor="start" font-weight="400">先图像和真实端侧推理，再空载舵机，最后人工单颗；动画秒数不能作为实际超时参数。</text><path d="M32.00,127.00 L1368.00,127.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><rect x="45" y="155" width="1310" height="65" rx="0" fill="#edf3ef" stroke="#b8c7c1" stroke-width="1.3"/><text x="54.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">阶段</text><text x="214.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">操作/预期</text><text x="869.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">失败处理</text><path d="M45.00,220.00 L1355.00,220.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="54.00" y="242.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">0 固定图推理</text><text x="214.00" y="242.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">BOX单摄预览、固定ROI、真实模型KPU推理、主屏显示</text><text x="869.00" y="242.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">未跑通不接执行器；保留原训练环境/权重</text><path d="M45.00,285.00 L1355.00,285.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="54.00" y="307.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">1 空载机构</text><text x="214.00" y="307.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">舵机6V断开先手转；检查0/90几何与限位，之后小角度</text><text x="869.00" y="307.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">卡滞先修机械；不加力硬顶，不猜舵机脉宽</text><path d="M45.00,350.00 L1355.00,350.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="54.00" y="372.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">2 待投豆</text><text x="214.00" y="372.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">关限位有效/开限位无效，人工放一颗、双手离开后KEY0</text><text x="869.00" y="372.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">限位矛盾/位置不明不运行；不自动找零</text><path d="M45.00,415.00 L1355.00,415.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="54.00" y="437.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">3 停豆拍摄</text><text x="214.00" y="437.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">相机持续预览，豆静止后取ROI；拒绝明显空槽/多豆/模糊</text><text x="869.00" y="437.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">人工重放；图像检查不保证发现所有贴连</text><path d="M45.00,480.00 L1355.00,480.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="54.00" y="502.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">4 识别/记录</text><text x="214.00" y="502.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">仅当前可见面；原标签映射；存1张JPEG+本地结果</text><text x="869.00" y="502.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">推理/存储失败保持关，标未完成，不自动放走</text><path d="M45.00,545.00 L1355.00,545.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="54.00" y="567.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">5 显示/放走</text><text x="214.00" y="567.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">正常结果展示后开；低置信拒判需KEY0确认才放走</text><text x="869.00" y="567.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">拒判不算正常；所有样本入同一杯</text><path d="M45.00,610.00 L1355.00,610.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="54.00" y="632.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">6 确认空槽再关</text><text x="214.00" y="632.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">开限位确认，清空条件满足后缓关，关限位确认回等待</text><text x="869.00" y="632.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">空槽不明确/开关超时→故障；不持续加力</text><path d="M45.00,675.00 L1355.00,675.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="54.00" y="697.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">7 连续10次</text><text x="214.00" y="697.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">重复10个有效人工样本，照片/结果/动作一一对应</text><text x="869.00" y="697.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">重复按键不重复记数，空拍不增加样本数</text><path d="M45.00,740.00 L1355.00,740.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="45.00" y="760.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">H1仅提供设计文件和教学动画，不表示已经完成固件、KPU、机械、光学或电气验收。</text><text x="45.00" y="794.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">模型部署优先于外壳美化；TF存储先设100次样本上限，满时停止新增循环，不覆盖用户已有文件。</text><text x="45.00" y="828.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">本包不修改firmware/k230d/bringup内用户新增工作；完整版资料保持原字节。</text><path d="M32.00,916.00 L1368.00,916.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="32.00" y="942.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="400">单位 mm · 尺寸为设计/布局提案，非孔位加工图；未知元件只画安装占位。按标注尺寸，不量屏幕或缩印图。</text><text x="1368.00" y="942.00" font-size="13" fill="#62736e" text-anchor="end" font-weight="400">06 / 6</text></svg>