<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-label="03  现有型材配料与单槽PP裁切"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.pick{cursor:pointer}.pick:hover polygon{stroke:#00876b;stroke-width:3}</style><rect width="1400" height="960" fill="#fffefa"/><text x="32.00" y="34.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="650">BEANLENS  /  HACKATHON H1 /  2026-10-19</text><text x="32.00" y="77.00" font-size="30" fill="#223d38" text-anchor="start" font-weight="650">03  现有型材配料与单槽PP裁切</text><text x="32.00" y="108.00" font-size="16" fill="#62736e" text-anchor="start" font-weight="400">单位mm。板面长、水平投影和高度分别标注；斜槽不按60mm水平长误裁。</text><path d="M32.00,127.00 L1368.00,127.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="45.00" y="160.00" font-size="22" fill="#223d38" text-anchor="start" font-weight="650">H13 PP3裁切 / YZ侧视</text><polygon points="100.00,660.00 296.60,660.00 296.60,480.00 100.00,342.34" fill="#69b6a0" fill-opacity="0.45" stroke="#223d38" stroke-width="1.15" stroke-linejoin="round"/><path d="M100.00,398.34 L296.60,536.00" fill="none" stroke="#6b9abb" stroke-width="6"/><text x="45.00" y="720.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">侧片×2：水平底49.149，上游高79.415，下游高45</text><text x="45.00" y="751.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">蓝线=槽底上表面；底板按24×60面长裁，厚3</text><text x="45.00" y="782.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">两侧名义内净24，内焊筋后有效宽目标≥20</text><rect x="600" y="155" width="760" height="47" rx="0" fill="#edf3ef" stroke="#b8c7c1" stroke-width="1.3"/><text x="609.00" y="177.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="650">物料</text><text x="759.00" y="177.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="650">数量/裁切</text><text x="1059.00" y="177.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="650">说明</text><path d="M600.00,202.00 L1360.00,202.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="609.00" y="224.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">黑2020</text><text x="759.00" y="224.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">460×4 / 200×4 / 180×4</text><text x="1059.00" y="224.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">12段；4根460直接作柱</text><path d="M600.00,249.00 L1360.00,249.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="609.00" y="271.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">余3根460</text><text x="759.00" y="271.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">各切200+180</text><text x="1059.00" y="271.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">每根余80扣锯缝/端面修整</text><path d="M600.00,296.00 L1360.00,296.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="609.00" y="318.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">1根400</text><text x="759.00" y="318.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">切200+180</text><text x="1059.00" y="318.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">余20扣锯缝；另一根400保留</text><path d="M600.00,343.00 L1360.00,343.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="609.00" y="365.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">海洋板6</text><text x="759.00" y="365.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">176×196共3片</text><text x="1059.00" y="365.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">底/工作/相机平台Z20/180/344</text><path d="M600.00,390.00 L1360.00,390.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="609.00" y="412.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">PP3底座</text><text x="759.00" y="412.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">80×110×1</text><text x="1059.00" y="412.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">开40×40口；与木板孔对齐</text><path d="M600.00,437.00 L1360.00,437.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="609.00" y="459.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">PP3挡片/旗片</text><text x="759.00" y="459.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">46×18 / 30×16，各1</text><text x="1059.00" y="459.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">孔按舵臂/限位纸样</text><path d="M600.00,484.00 L1360.00,484.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="609.00" y="506.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">黑PP2</text><text x="759.00" y="506.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">120×100两片；110×100一片</text><text x="1059.00" y="506.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">三片遮光，前方留手投口</text><path d="M600.00,531.00 L1360.00,531.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="609.00" y="553.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">紧固/灯/相机</text><text x="759.00" y="553.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">详BOM H08/H17/H18/H30</text><text x="1059.00" y="553.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">不凭占位图钻最终孔</text><path d="M600.00,578.00 L1360.00,578.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="610.00" y="640.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">工作板孔：全局X85/Y122，50×45；底座孔X90/Y124，40×40。</text><text x="610.00" y="674.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">前后/左右必须对齐，禁止豆被木板或底座挡住。</text><text x="610.00" y="708.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">PP3先小样焊接，冷却去毛刺；实豆能滑至挡片再固定坡度。</text><text x="610.00" y="742.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">PP3 200方与相机载板一起排版；遮光PP2 300×200候选。</text><text x="610.00" y="776.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">模块底189，槽底下端220，上端254.414，槽壁高14。</text><text x="610.00" y="810.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">不按旧完整版的1kg料斗承载计算本版手投支架。</text><path d="M32.00,916.00 L1368.00,916.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="32.00" y="942.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="400">单位 mm · 尺寸为设计/布局提案，非孔位加工图；未知元件只画安装占位。按标注尺寸，不量屏幕或缩印图。</text><text x="1368.00" y="942.00" font-size="13" fill="#62736e" text-anchor="end" font-weight="400">03 / 6</text></svg>