<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><style>text{font-family:system-ui,"PingFang SC",sans-serif}</style><rect width="1200" height="650" fill="#fffefa"/><text x="35.000" y="48.000" font-size="28" fill="#243e36" text-anchor="start">主斗斜接接缝：垂直于斜边的剖面</text><text x="35.000" y="84.000" font-size="18" fill="#243e36" text-anchor="start">解释放大图；不量图加工；两侧PP均为2mm法向厚度。</text><polygon points="420.00,320.00 219.93,129.87 203.40,147.27 420.00,353.11" fill="#b7d8cc" stroke="#243e36" stroke-width="1.5"/><polygon points="420.00,320.00 620.07,129.87 636.60,147.27 420.00,353.11" fill="#b7d8cc" stroke="#243e36" stroke-width="1.5"/><path d="M393.90380277173915,328.3093106786198 Q420,399.50827215332095 446.09619722826085,328.3093106786198 L420,353.10827215332097Z" fill="#d99458" stroke="#a56835" stroke-width="1.5"/><path d="M420.0000,320.0000L420.0000,353.1083" stroke="#795c42" stroke-width="1.5" fill="none" stroke-dasharray="1.5 1"/><text x="420.000" y="190.000" font-size="23" fill="#243e36" text-anchor="middle">豆路内侧</text><text x="720.000" y="230.000" font-size="20" fill="#243e36" text-anchor="start">内侧接边应贴合</text><text x="720.000" y="265.000" font-size="18" fill="#243e36" text-anchor="start">接缝0–0.2mm是试样目标</text><text x="720.000" y="305.000" font-size="18" fill="#243e36" text-anchor="start">根部必须熔合；需要时内侧补细焊</text><text x="720.000" y="340.000" font-size="18" fill="#243e36" text-anchor="start">冷却后检查、修平挂豆台阶</text><path d="M430.0000,320.0000L700.0000,320.0000" stroke="#243e36" stroke-width="1.3" fill="none"/><text x="420.000" y="440.000" font-size="22" fill="#a56835" text-anchor="middle">外侧主焊缝</text><path d="M420.0000,385.0000L420.0000,411.0000" stroke="#a56835" stroke-width="1.5" fill="none"/><text x="420.000" y="475.000" font-size="18" fill="#243e36" text-anchor="middle">外焊筋法向≤3是净空上限，需试焊确认强度</text><text x="45.000" y="540.000" font-size="20" fill="#243e36" text-anchor="start">主斗内夹角92.920°；两片侧边各离直切倒角43.540°，不统一削45°。</text><text x="45.000" y="580.000" font-size="19" fill="#243e36" text-anchor="start">上下端还需单独修成水平面：前后25.726°、左右6.740°（均为离直切角）。</text><text x="45.000" y="617.000" font-size="18" fill="#243e36" text-anchor="start">尺寸包含名义板厚；实际热收缩、焊接变形须在定位框/试件上量，不用随意多加1mm代替。</text></svg>