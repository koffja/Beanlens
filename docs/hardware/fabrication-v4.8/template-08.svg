<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><style>text{font-family:Arial,"PingFang SC",sans-serif}</style><rect width="210" height="297" fill="white"/><text x="12.000" y="12.000" font-size="3" fill="#243e36" text-anchor="start">BEANLENS / V4.8 / 2026-10-16</text><text x="12.000" y="23.000" font-size="5.2" fill="#243e36" text-anchor="start">双屏框/过件孔：装配参考1:1</text><text x="12.000" y="31.000" font-size="3.1" fill="#243e36" text-anchor="start">尺寸单位mm；原尺寸模板；粗坯修边/角度/首样试焊仍需检查。</text><rect x="30" y="55" width="80" height="64" fill="#e8f1eb" stroke="#243e36" stroke-width=".3"/><rect x="39.5" y="65" width="61" height="44" fill="white" stroke="#243e36" stroke-width=".3"/><text x="130.000" y="76.000" font-size="3.6" fill="#243e36" text-anchor="start">前框80×64×2</text><text x="130.000" y="84.000" font-size="3.2" fill="#243e36" text-anchor="start">框视窗61×44候选</text><text x="130.000" y="92.000" font-size="3.2" fill="#243e36" text-anchor="start">木板过件65.3×48.6</text><rect x="45" y="165" width="56" height="38" fill="#e8f1eb" stroke="#243e36" stroke-width=".3"/><rect x="53" y="172" width="40" height="24" fill="white" stroke="#243e36" stroke-width=".3"/><text x="118.000" y="177.000" font-size="3.3" fill="#243e36" text-anchor="start">侧面木板过件孔40×24</text><text x="118.000" y="185.000" font-size="3.3" fill="#243e36" text-anchor="start">外框56×38，孔先实配</text><text x="12.000" y="228.000" font-size="3.2" fill="#243e36" text-anchor="start">前孔原点整机X77.35/Z345.7；主屏朝前。</text><text x="12.000" y="233.000" font-size="3.2" fill="#243e36" text-anchor="start">侧孔原点整机Y68.185/Z348.16；小屏朝右，长边沿Y。</text><text x="12.000" y="238.000" font-size="3.2" fill="#243e36" text-anchor="start">侧压框视窗33.4×18.4是候选，按有效区实物找正。</text><text x="12.000" y="243.000" font-size="3.2" fill="#243e36" text-anchor="start">C6 M2参考孔距13.08×32；原图2.5H，不盲用M3。</text><text x="12.000" y="248.000" font-size="3.2" fill="#243e36" text-anchor="start">这页不替代厂家孔位基准；先做纸面罩，不直接批量钻孔。</text><path d="M20.0000,279.0000L120.0000,279.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><path d="M20.0000,277.0000L20.0000,281.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><path d="M120.0000,277.0000L120.0000,281.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><text x="70.000" y="277.000" font-size="3" fill="#243e36" text-anchor="middle">100mm校验线：实际大小打印，不适合页面</text><text x="12.000" y="290.000" font-size="3" fill="#243e36" text-anchor="start">V4.7内面模板已过时，本版已计2mm法向板厚。</text><text x="198.000" y="290.000" font-size="3" fill="#243e36" text-anchor="end">8/8</text></svg>