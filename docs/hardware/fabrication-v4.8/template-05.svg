oke-width=".3"/><circle cx="38" cy="244" r="1.7" fill="none" stroke="#ae6435" stroke-width=".3"/><circle cx="172" cy="190" r="1.7" fill="none" stroke="#ae6435" stroke-width=".3"/><circle cx="172" cy="244" r="1.7" fill="none" stroke="#ae6435" stroke-width=".3"/><text x="105.000" y="218.000" font-size="3.3" fill="#243e36" text-anchor="middle">食品接触硅胶：自由厚1mm</text><text x="12.000" y="258.000" font-size="3.2" fill="#243e36" text-anchor="start">孔Ø3.4候选：距边6；4×M3×16，不能顶住豆路。</text><text x="12.000" y="263.000" font-size="3.2" fill="#243e36" text-anchor="start">1mm硅胶名义压到0.8；限压0.5+0.3，实物复核。</text><text x="12.000" y="268.000" font-size="3.2" fill="#243e36" text-anchor="start">两法兰6＋密封0.8＋过渡24.9＋五窗18.3＝50。</text><path d="M20.0000,279.0000L120.0000,279.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><path d="M20.0000,277.0000L20.0000,281.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><path d="M120.0000,277.0000L120.0000,281.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><text x="70.000" y="277.000" font-size="3" fill="#243e36" text-anchor="middle">100mm校验线：实际大小打印，不适合页面</text><text x="12.000" y="290.000" font-size="3" fill="#243e36" text-anchor="start">V4.7内面模板已过时，本版已计2mm法向板厚。</text><text x="198.000" y="290.000" font-size="3" fill="#243e36" text-anchor="end">5/8</text></svg>