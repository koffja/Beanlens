<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><style>text{font-family:Arial,"PingFang SC",sans-serif}</style><rect width="210" height="297" fill="white"/><text x="12.000" y="12.000" font-size="3" fill="#243e36" text-anchor="start">BEANLENS / V4.8 / 2026-10-16</text><text x="12.000" y="23.000" font-size="5.2" fill="#243e36" text-anchor="start">五窗叠片：PP3 / 1:1</text><text x="12.000" y="31.000" font-size="3.1" fill="#243e36" text-anchor="start">尺寸单位mm；原尺寸模板；粗坯修边/角度/首样试焊仍需检查。</text><rect x="35" y="65" width="140" height="30" fill="#e8f1eb" stroke="#243e36" stroke-width=".3"/><rect x="64" y="74" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="81" y="74" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="98" y="74" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="115" y="74" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="132" y="74" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><circle cx="42.5" cy="80.0" r="1.6" fill="none" stroke="#ae6435" stroke-width=".3" stroke-dasharray="1 1"/><circle cx="167.5" cy="80.0" r="1.6" fill="none" stroke="#ae6435" stroke-width=".3" stroke-dasharray="1 1"/><text x="105.000" y="58.000" font-size="3.5" fill="#243e36" text-anchor="middle">U1/U2：PP3，140×30，做两片</text><rect x="35" y="170" width="140" height="18" fill="#e8f1eb" stroke="#243e36" stroke-width=".3"/><rect x="64" y="173" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="81" y="173" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="98" y="173" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="115" y="173" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="132" y="173" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><circle cx="42.5" cy="179.0" r="1.6" fill="none" stroke="#ae6435" stroke-width=".3" stroke-dasharray="1 1"/><circle cx="167.5" cy="179.0" r="1.6" fill="none" stroke="#ae6435" stroke-width=".3" stroke-dasharray="1 1"/><text x="105.000" y="162.000" font-size="3.5" fill="#243e36" text-anchor="middle">L1/L2：PP3，140×18，做两片</text><text x="12.000" y="218.000" font-size="3.2" fill="#243e36" text-anchor="start">每窗14×12，筋3；X29/46/63/80/97。</text><text x="12.000" y="223.000" font-size="3.2" fill="#243e36" text-anchor="start">上窗Y9，下窗Y3；装后全在全局Y114→126。</text><text x="12.000" y="228.000" font-size="3.2" fill="#243e36" text-anchor="start">小斗先焊U2，完全冷却校平再叠装；不在闸片旁热焊。</text><text x="12.000" y="233.000" font-size="3.2" fill="#243e36" text-anchor="start">红孔是候选，先量隔距与滑闸路径；做单槽再扩五槽。</text><path d="M20.0000,279.0000L120.0000,279.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><path d="M20.0000,277.0000L20.0000,281.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><path d="M120.0000,277.0000L120.0000,281.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><text x="70.000" y="277.000" font-size="3" fill="#243e36" text-anchor="middle">100mm校验线：实际大小打印，不适合页面</text><text x="12.000" y="290.000" font-size="3" fill="#243e36" text-anchor="start">V4.7内面模板已过时，本版已计2mm法向板厚。</text><text x="198.000" y="290.000" font-size="3" fill="#243e36" text-anchor="end">6/8</text></svg>