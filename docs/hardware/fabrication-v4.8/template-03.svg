<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><style>text{font-family:Arial,"PingFang SC",sans-serif}</style><rect width="210" height="297" fill="white"/><text x="12.000" y="12.000" font-size="3" fill="#243e36" text-anchor="start">BEANLENS / V4.8 / 2026-10-16</text><text x="12.000" y="23.000" font-size="5.2" fill="#243e36" text-anchor="start">C/D 小过渡斗：2mm实料外面</text><text x="12.000" y="31.000" font-size="3.1" fill="#243e36" text-anchor="start">尺寸单位mm；原尺寸模板；粗坯修边/角度/首样试焊仍需检查。</text><polygon points="47.70555110452646,55 162.29444889547355,55 148.29444889547355,81.47659343646761 61.70555110452646,81.47659343646761" fill="#e8f1eb" stroke="#243e36" stroke-width=".35"/><text x="105.000" y="68.238" font-size="3.1" fill="#243e36" text-anchor="middle">C 外上114.589</text><polygon points="47.70555110452646,110 162.29444889547355,110 148.29444889547355,136.47659343646762 61.70555110452646,136.47659343646762" fill="#e8f1eb" stroke="#243e36" stroke-width=".35"/><text x="105.000" y="123.238" font-size="3.1" fill="#243e36" text-anchor="middle">C 外上114.589</text><polygon points="20,176 54.25326802192251,176 45.25326802192251,204.56588874864565 29.0,204.56588874864565" fill="#e8f1eb" stroke="#243e36" stroke-width=".35"/><text x="37.127" y="190.283" font-size="3.1" fill="#243e36" text-anchor="middle">D 外上34.253</text><polygon points="135,176 169.2532680219225,176 160.2532680219225,204.56588874864565 144.0,204.56588874864565" fill="#e8f1eb" stroke="#243e36" stroke-width=".35"/><text x="152.127" y="190.283" font-size="3.1" fill="#243e36" text-anchor="middle">D 外上34.253</text><text x="12.000" y="231.000" font-size="3.2" fill="#243e36" text-anchor="start">C外斜高26.477；D外斜高28.566，各两片。</text><text x="12.000" y="236.000" font-size="3.2" fill="#243e36" text-anchor="start">侧边倒角40.205°；端部C 19.872° / D 29.347°。</text><text x="12.000" y="241.000" font-size="3.2" fill="#243e36" text-anchor="start">内口110×30→82×12；垂直高24.9，不能用旧28.7模板。</text><text x="12.000" y="246.000" font-size="3.2" fill="#243e36" text-anchor="start">黑线只控制外面；端面和斜接须先试夹，STL含完整名义实体。</text><path d="M20.0000,279.0000L120.0000,279.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><path d="M20.0000,277.0000L20.0000,281.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><path d="M120.0000,277.0000L120.0000,281.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><text x="70.000" y="277.000" font-size="3" fill="#243e36" text-anchor="middle">100mm校验线：实际大小打印，不适合页面</text><text x="12.000" y="290.000" font-size="3" fill="#243e36" text-anchor="start">V4.7内面模板已过时，本版已计2mm法向板厚。</text><text x="198.000" y="290.000" font-size="3" fill="#243e36" text-anchor="end">3/8</text></svg>