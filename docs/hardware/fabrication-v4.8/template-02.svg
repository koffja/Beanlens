<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><style>text{font-family:Arial,"PingFang SC",sans-serif}</style><rect width="210" height="297" fill="white"/><text x="12.000" y="12.000" font-size="3" fill="#243e36" text-anchor="start">BEANLENS / V4.8 / 2026-10-16</text><text x="12.000" y="23.000" font-size="5.2" fill="#243e36" text-anchor="start">B 主斗左/右：外面实料1:1</text><text x="12.000" y="31.000" font-size="3.1" fill="#243e36" text-anchor="start">尺寸单位mm；原尺寸模板；粗坯修边/角度/首样试焊仍需检查。</text><polygon points="34.77995607220886,54 175.22004392779115,54 122.22004392779114,164.76551810017412 87.77995607220886,164.76551810017412" fill="#e8f1eb" stroke="#243e36" stroke-width=".35"/><polygon points="37.0,54.236363636363635 173.0,54.236363636363635 120.0,165.00188173653777 90.0,165.00188173653777" fill="none" stroke="#387ca4" stroke-width=".35" stroke-dasharray="1.5 1"/><path d="M34.7800,47.0000L175.2200,47.0000" stroke="#ae6435" stroke-width="0.3" fill="none"/><text x="105.000" y="45.000" font-size="3.2" fill="#ae6435" text-anchor="middle">140.440 外面上边</text><path d="M87.7800,172.7655L122.2200,172.7655" stroke="#ae6435" stroke-width="0.3" fill="none"/><text x="105.000" y="170.766" font-size="3.2" fill="#ae6435" text-anchor="middle">34.440 外面下边</text><text x="14.000" y="202.000" font-size="3.2" fill="#243e36" text-anchor="start">外面斜高110.766；两片；内面上136 / 下30。</text><text x="14.000" y="207.000" font-size="3.2" fill="#243e36" text-anchor="start">黑实线：外面实料轮廓；蓝虚线：内面法向投影。</text><text x="14.000" y="212.000" font-size="3.2" fill="#243e36" text-anchor="start">蓝线是理解板厚用，不是第二条裁切边；不能直接照蓝线切。</text><text x="14.000" y="217.000" font-size="3.2" fill="#243e36" text-anchor="start">两斜边离直切倒角43.540°（非统一45°）。</text><text x="14.000" y="222.000" font-size="3.2" fill="#243e36" text-anchor="start">上下端离直切修6.740°，装配后端面水平。</text><text x="14.000" y="227.000" font-size="3.2" fill="#243e36" text-anchor="start">先粗切留1–2mm，再按夹具/端面修到黑线尺寸。</text><text x="14.000" y="232.000" font-size="3.2" fill="#243e36" text-anchor="start">接缝目标0–0.2；主要外焊，内部检查熔合并修平。</text><text x="14.000" y="237.000" font-size="3.2" fill="#243e36" text-anchor="start">外焊筋法向≤3，净空按水平4mm储备；超出需重核。</text><path d="M20.0000,279.0000L120.0000,279.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><path d="M20.0000,277.0000L20.0000,281.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><path d="M120.0000,277.0000L120.0000,281.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><text x="70.000" y="277.000" font-size="3" fill="#243e36" text-anchor="middle">100mm校验线：实际大小打印，不适合页面</text><text x="12.000" y="290.000" font-size="3" fill="#243e36" text-anchor="start">V4.7内面模板已过时，本版已计2mm法向板厚。</text><text x="198.000" y="290.000" font-size="3" fill="#243e36" text-anchor="end">2/8</text></svg>