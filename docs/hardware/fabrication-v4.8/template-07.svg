<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><style>text{font-family:Arial,"PingFang SC",sans-serif}</style><rect width="210" height="297" fill="white"/><text x="12.000" y="12.000" font-size="3" fill="#243e36" text-anchor="start">BEANLENS / V4.8 / 2026-10-16</text><text x="12.000" y="23.000" font-size="5.2" fill="#243e36" text-anchor="start">POM支承与隔距：1:1</text><text x="12.000" y="31.000" font-size="3.1" fill="#243e36" text-anchor="start">尺寸单位mm；原尺寸模板；粗坯修边/角度/首样试焊仍需检查。</text><rect x="35" y="70" width="140" height="30" fill="#e8f1eb" stroke="#243e36" stroke-width=".3"/><rect x="64" y="79" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="81" y="79" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="98" y="79" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="115" y="79" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="132" y="79" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><circle cx="42.5" cy="85.0" r="1.6" fill="none" stroke="#ae6435" stroke-width=".3" stroke-dasharray="1 1"/><circle cx="167.5" cy="85.0" r="1.6" fill="none" stroke="#ae6435" stroke-width=".3" stroke-dasharray="1 1"/><text x="105.000" y="60.000" font-size="3.5" fill="#243e36" text-anchor="middle">POM4：140×30，仅一片，不焊PP</text><rect x="50" y="150" width="10" height="30" fill="#e8f1eb" stroke="#243e36" stroke-width=".3"/><rect x="150" y="150" width="10" height="30" fill="#e8f1eb" stroke="#243e36" stroke-width=".3"/><text x="12.000" y="210.000" font-size="3.2" fill="#243e36" text-anchor="start">闸片110×45×2位于两侧隔距件之间；行程15。</text><text x="12.000" y="215.000" font-size="3.2" fill="#243e36" text-anchor="start">名义缝2.3＝闸片2＋总余量0.3，按实测厚调。</text><text x="12.000" y="220.000" font-size="3.2" fill="#243e36" text-anchor="start">隔距10×30×2两条＋0.3薄垫，放局部X0–10/130–140。</text><text x="12.000" y="225.000" font-size="3.2" fill="#243e36" text-anchor="start">螺钉不穿闸片；手推不卡再接舵机；防护未冻结先不带豆。</text><path d="M20.0000,279.0000L120.0000,279.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><path d="M20.0000,277.0000L20.0000,281.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><path d="M120.0000,277.0000L120.0000,281.0000" stroke="#243e36" stroke-width="0.3" fill="none"/><text x="70.000" y="277.000" font-size="3" fill="#243e36" text-anchor="middle">100mm校验线：实际大小打印，不适合页面</text><text x="12.000" y="290.000" font-size="3" fill="#243e36" text-anchor="start">V4.7内面模板已过时，本版已计2mm法向板厚。</text><text x="198.000" y="290.000" font-size="3" fill="#243e36" text-anchor="end">7/8</text></svg>