/><text x="199.80" y="665.77" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">H05</text><rect x="233.79000000000002" y="644.77" width="37.2" height="27.900000000000002" rx="0" fill="#d5b58a" stroke="#223d38" stroke-width="1.3"/><text x="239.79" y="665.77" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">H06</text><path d="M45.00,773.00 L603.00,773.00" fill="none" stroke="#cb8351" stroke-width="1.5"/><path d="M45.00,768.00 L45.00,778.00" fill="none" stroke="#cb8351" stroke-width="1.5"/><path d="M603.00,768.00 L603.00,778.00" fill="none" stroke="#cb8351" stroke-width="1.5"/><text x="324.00" y="765.00" font-size="16" fill="#cb8351" text-anchor="middle" font-weight="650">600</text><rect x="665" y="155" width="690" height="36" rx="0" fill="#edf3ef" stroke="#b8c7c1" stroke-width="1.3"/><text x="674.00" y="177.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="650">板号</text><text x="809.00" y="177.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="650">净裁切尺寸 / 数量</text><text x="1064.00" y="177.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="650">位置 / 连接</text><path d="M665.00,191.00 L1355.00,191.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="674.00" y="213.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">P01/P02</text><text x="809.00" y="213.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">220×240×6，各1</text><text x="1064.00" y="213.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">前固定 / 后可拆，Z200→440</text><path d="M665.00,227.00 L1355.00,227.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="674.00" y="249.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">P03/P04</text><text x="809.00" y="249.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">240×240×6，各1</text><text x="1064.00" y="249.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">左右包侧；前后板夹在侧板之间</text><path d="M665.00,263.00 L1355.00,263.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="674.00" y="285.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">H01/H02</text><text x="809.00" y="285.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">154×110×6，各1</text><text x="1064.00" y="285.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">料斗前后板（H02排版旋转90°）</text><path d="M665.00,299.00 L1355.00,299.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="674.00" y="321.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">H03/H04</text><text x="809.00" y="321.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">142×110×6，各1</text><text x="1064.00" y="321.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">夹在前后板之间，外尺寸154</text><path d="M665.00,335.00 L1355.00,335.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="674.00" y="357.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">H05/H06</text><text x="809.00" y="357.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">40×30×6，各1</text><text x="1064.00" y="357.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">左右托耳；搭侧梁并托住木壳</text><path d="M665.00,371.00 L1355.00,371.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="670.00" y="426.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">面板外壳：232宽×252深×440高（不含脚垫/插头）。</text><text x="670.00" y="455.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">正面下方：180宽，遮光底板下约174高可取盒。</text><text x="670.00" y="484.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">排版预留：板边约3，矩形间距至少3（按锯片复核）。</text><text x="670.00" y="513.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">实际6mm板厚需量；若厚度不同，侧板142重新算。</text><text x="670.00" y="575.00" font-size="18" fill="#223d38" text-anchor="start" font-weight="650">局部：料斗耳板托住木壳，不横挡110×30豆路</text><rect x="715" y="661" width="75" height="110" rx="0" fill="#b8c8d0" stroke="#223d38" stroke-width="1.3"/><rect x="715" y="639" width="150" height="22" rx="0" fill="#d5b58a" stroke="#223d38" stroke-width="1.3"/><rect x="838" y="590" width="22" height="49" rx="0" fill="#d5b58a" stroke="#223d38" stroke-width="1.3"/><text x="895.00" y="621.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">木壳底面 Z330</text><text x="895.00" y="648.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">托耳厚6，下面 Z324</text><text x="895.00" y="675.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">侧梁顶面 Z324</text><text x="895.00" y="702.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">托耳宽40：跨13间隙＋6木壁，</text><text x="895.00" y="729.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">另一端搭住20型材。</text><path d="M790.00,655.00 L875.00,655.00" fill="none" stroke="#cb8351" stroke-width="1.5" stroke-dasharray="6 5"/><text x="715.00" y="804.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">托耳螺钉进型材T螺母；木壳与托耳用外侧小角片固定。</text><text x="40.00" y="884.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">所有屏幕、按钮、USB/TF及相机支架孔先不加工。板料表是净裁切提案，非1:1刀模；中间不加木底板。</text><path d="M32.00,916.00 L1368.00,916.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="32.00" y="942.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="400">单位 mm · 尺寸为设计/布局提案，非孔位加工图；未知元件只画安装占位。按标注尺寸，不量屏幕或缩印图。</text><text x="1368.00" y="942.00" font-size="13" fill="#62736e" text-anchor="end" font-weight="400">03 / 07</text></svg>