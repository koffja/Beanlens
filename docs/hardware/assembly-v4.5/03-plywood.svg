size="15" fill="#223d38" text-anchor="start" font-weight="400">196×280×6，各1</text><text x="1059.00" y="276.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">左/右下板 Z22→302</text><path d="M650.00,287.00 L1360.00,287.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="659.00" y="309.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">P08</text><text x="794.00" y="309.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">176×197×6，1</text><text x="1059.00" y="309.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">后下板 Z22→219</text><path d="M650.00,320.00 L1360.00,320.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="659.00" y="342.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">P07/P09</text><text x="794.00" y="342.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">176×58×6，各1</text><text x="1059.00" y="342.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">后/前中板 Z244→302</text><path d="M650.00,353.00 L1360.00,353.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="659.00" y="375.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">H01/H02</text><text x="794.00" y="375.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">158×110×6，各1</text><text x="1059.00" y="375.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">料斗前/后板</text><path d="M650.00,386.00 L1360.00,386.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="659.00" y="408.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">H03/H04</text><text x="794.00" y="408.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">146×110×6，各1</text><text x="1059.00" y="408.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">料斗左/右板</text><path d="M650.00,419.00 L1360.00,419.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="659.00" y="441.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">H05/H06</text><text x="794.00" y="441.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">40×30×6，各1</text><text x="1059.00" y="441.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">托耳；不改变Z330底面</text><path d="M650.00,452.00 L1360.00,452.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="660.00" y="490.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">外廓回到220×240，木板不包住柱面；边缝约2。</text><text x="660.00" y="520.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">板面内凹约1：6mm板＋隔距＋内侧角片背托。</text><text x="660.00" y="550.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">上板跨中横梁会相撞，所以以外露腰线分块。</text><text x="660.00" y="580.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">后相机梁也外露，后板分三段；正面留取盒口。</text><text x="660.00" y="610.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">若已买600方：改用两张600×600，不重复买800板。</text><text x="660.00" y="640.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">板边/锯缝按3mm排，最终螺孔先做一只板角样件。</text><text x="660.00" y="711.00" font-size="19" fill="#223d38" text-anchor="start" font-weight="650">F11：先做“型材＋角片＋隔距＋板”角样</text><text x="660.00" y="748.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">长板各4点，58高短板各2点，共32木板固定点。</text><text x="660.00" y="777.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">另2点固定前黑PP遮光条，购40套含备用。</text><text x="660.00" y="806.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">M3×25沉头；隔距示意11，按角片实物调。</text><text x="660.00" y="835.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">板只封边/遮光，不顶称台或借豆盒承重。</text><text x="40.00" y="884.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">本页是保守可切排版；两张600方替代排版另见V4.7制作页。屏幕/按钮孔按实物，按钮中心下移Z273。</text><path d="M32.00,916.00 L1368.00,916.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="32.00" y="942.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="400">单位 mm · 尺寸为设计/布局提案，非孔位加工图；未知元件只画安装占位。按标注尺寸，不量屏幕或缩印图。</text><text x="1368.00" y="942.00" font-size="13" fill="#62736e" text-anchor="end" font-weight="400">03 / 07</text></svg>