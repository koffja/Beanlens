<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-label="05  相机、灯、称台与电控安装剖面"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.pick{cursor:pointer}.pick:hover polygon{stroke:#00876b;stroke-width:3}</style><rect width="1400" height="960" fill="#fffefa"/><text x="32.00" y="34.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="650">BEANLENS  /  ASSEMBLY V4.7 INSET /  2026-10-16</text><text x="32.00" y="77.00" font-size="30" fill="#223d38" text-anchor="start" font-weight="650">05  相机、灯、称台与电控安装剖面</text><text x="32.00" y="108.00" font-size="16" fill="#62736e" text-anchor="start" font-weight="400">相机与灯固定在机架，收豆盒只压独立称台。图中的称重虚框不是HJ-AZ4实际外形。</text><path d="M32.00,127.00 L1368.00,127.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="40.00" y="163.00" font-size="20" fill="#223d38" text-anchor="start" font-weight="650">侧剖面 / 前← Y →后；X方向看全部五槽</text><rect x="65.0" y="209.0" width="324.0" height="621.0" rx="0" fill="none" stroke="#b8c7c1" stroke-width="1.3"/><rect x="65.0" y="209.0" width="27.0" height="621.0" rx="0" fill="#30353b" stroke="#223d38" stroke-width="1.3"/><rect x="362.0" y="209.0" width="27.0" height="621.0" rx="0" fill="#30353b" stroke="#223d38" stroke-width="1.3"/><rect x="120.35" y="236.0" width="213.3" height="148.5" rx="0" fill="#ead9bf" stroke="#223d38" stroke-width="1.3"/><polygon points="135.20,236.00 318.80,236.00 247.25,384.50 206.75,384.50" fill="#69b6a0" fill-opacity="0.5" stroke="#223d38" stroke-width="1.15" stroke-linejoin="round"/><rect x="197.3" y="384.49999999999994" width="59.400000000000006" height="67.5" rx="0" fill="none" stroke="#69b6a0" stroke-width="1.3"/><path d="M216.88,435.80 L277.62,435.80" fill="none" stroke="#cb8351" stroke-width="4"/><rect x="92.0" y="477.3125" width="33.75" height="54.0" rx="0" fill="#6b9abb" stroke="#223d38" stroke-width="1.3"/><rect x="328.25" y="477.3125" width="33.75" height="54.0" rx="0" fill="#6b9abb" stroke="#