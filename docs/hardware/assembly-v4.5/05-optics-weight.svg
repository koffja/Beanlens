"#cb8351" text-anchor="middle" font-weight="650">75起试</text><path d="M396.00,384.50 L424.00,384.50" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="429.00" y="389.50" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">料斗口Z330</text><path d="M396.00,435.80 L424.00,435.80" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="429.00" y="440.80" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">闸片顶Z292</text><path d="M396.00,452.00 L424.00,452.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="429.00" y="457.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">槽口Z280</text><path d="M396.00,504.31 L424.00,504.31" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="429.00" y="509.31" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">光轴Z241.25</text><path d="M396.00,566.75 L424.00,566.75" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="429.00" y="571.75" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">遮光顶Z195</text><path d="M396.00,769.25 L424.00,769.25" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="429.00" y="774.25" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">台面Z45目标</text><text x="66.00" y="875.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">底板孔130×50；盒口≤Z175，净间距需计板厚。</text><rect x="680" y="155" width="680" height="34" rx="0" fill="#edf3ef" stroke="#b8c7c1" stroke-width="1.3"/><text x="689.00" y="177.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="650">BOM</text><text x="834.00" y="177.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="650">安装方法 / 对照尺寸</text><path d="M680.00,189.00 L1360.00,189.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="689.00" y="211.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">B01 / B13</text><text x="834.00" y="211.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">前后相机各一套，固定独立T17/T18梁</text><path d="M680.00,223.00 L1360.00,223.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="689.00" y="245.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">B13</text><text x="834.00" y="245.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">L角铝30×30×2、长40＋40方载板毛坯</text><path d="M680.00,257.00 L1360.00,257.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="689.00" y="279.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">A05 / L02</text><text x="834.00" y="279.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">四条竖灯100有效长；前后各两条，斜照</text><path d="M680.00,291.00 L1360.00,291.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="689.00" y="313.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">PH01 / PH04</text><text x="834.00" y="313.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">收发头两侧，光束中心约Z277</text><path d="M680.00,325.00 L1360.00,325.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="689.00" y="347.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">F07</text><text x="834.00" y="347.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">遮光底板180×200×1，开130×50通口</text><path d="M680.00,359.00 L1360.00,359.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="689.00" y="381.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">W06</text><text x="834.00" y="381.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">固定底板180×190×4，先核角码净空</text><path d="M680.00,393.00 L1360.00,393.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="689.00" y="415.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">W01</text><text x="834.00" y="415.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">HJ-AZ4外形与接口未知；收到图后定孔</text><path d="M680.00,427.00 L1360.00,427.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="689.00" y="449.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">W05</text><text x="834.00" y="449.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">活动台170×180×2，只连接称重活动端</text><path d="M680.00,461.00 L1360.00,461.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="689.00" y="483.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">B12</text><text x="834.00" y="483.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">盒≤160×170×130，不接墙/承重滑轨</text><path d="M680.00,495.00 L1360.00,495.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="689.00" y="517.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">F06</text><text x="834.00" y="517.00" font-size="15" fill="#223d38" text-anchor="start" font-weight="400">BOX、C6、后电控三片托板由200方铝板排</text><path d="M680.00,529.00 L1360.00,529.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="690.00" y="565.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">称重力路：豆＋盒 → W05 → 传感器 → W06 → 机架。</text><text x="690.00" y="596.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">后电控移下部Y207，板Z50→180；模块朝后≤21厚起试。</text><text x="690.00" y="627.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">BOX夹持板80×60×2，C6夹持板60×35×2均为毛坯。</text><text x="690.00" y="658.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">BOX壳64.3×47.6×15.4；箱内服务深度约35起试。</text><text x="690.00" y="689.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">24V适配器在机外；后板内只布置低压配电。</text><text x="690.00" y="720.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">豆盒向前移5，后留约7；高模块须重排，不挤碰盒/称台。</text><text x="690.00" y="790.00" font-size="16" fill="#cb8351" text-anchor="start" font-weight="400">当前未解决：HJ-AZ4组件高度/孔距；GC2093实际PCB/镜头长度；</text><text x="690.00" y="818.00" font-size="16" fill="#cb8351" text-anchor="start" font-weight="400">MG996R支架共面高度与扫掠；灯条切点与散热槽；后视锥净空。</text><text x="690.00" y="846.00" font-size="16" fill="#cb8351" text-anchor="start" font-weight="400">称台Z45与前后75均是目标起点，未核实前不钻最终孔。</text><path d="M32.00,916.00 L1368.00,916.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="32.00" y="942.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="400">单位 mm · 尺寸为设计/布局提案，非孔位加工图；未知元件只画安装占位。按标注尺寸，不量屏幕或缩印图。</text><text x="1368.00" y="942.00" font-size="13" fill="#62736e" text-anchor="end" font-weight="400">05 / 07</text></svg>