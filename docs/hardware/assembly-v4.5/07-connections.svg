<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-label="07  三种常见连接的放大装配图"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.pick{cursor:pointer}.pick:hover polygon{stroke:#00876b;stroke-width:3}</style><rect width="1400" height="960" fill="#fffefa"/><text x="32.00" y="34.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="650">BEANLENS  /  ASSEMBLY V4.5  /  2026-10-13</text><text x="32.00" y="77.00" font-size="30" fill="#223d38" text-anchor="start" font-weight="650">07  三种常见连接的放大装配图</text><text x="32.00" y="108.00" font-size="16" fill="#62736e" text-anchor="start" font-weight="400">螺钉长度按真实板厚、垫片和螺纹深度核对；图示只说明方向及层次，不代替零件厂家尺寸图。</text><path d="M32.00,127.00 L1368.00,127.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="40.00" y="165.00" font-size="22" fill="#223d38" text-anchor="start" font-weight="650">A / 两根型材怎样用角码连接</text><rect x="85" y="215" width="75" height="300" rx="0" fill="#b8c8d0" stroke="#223d38" stroke-width="1.3"/><rect x="160" y="440" width="320" height="75" rx="0" fill="#b8c8d0" stroke="#223d38" stroke-width="1.3"/><rect x="160" y="354" width="24" height="86" rx="0" fill="#6b9abb" stroke="#223d38" stroke-width="1.3"/><rect x="160" y="416" width="130" height="24" rx="0" fill="#6b9abb" stroke="#223d38" stroke-width="1.3"/><circle cx="172" cy="391" r="8" fill="white" stroke="#223d38" stroke-width="1.3"/><circle cx="249" cy="428" r="8" fill="white" stroke="#223d38" stroke-width="1.3"/><path d="M121.00,220.00 L121.00,507.00" fill="none" stroke="#62736e" stroke-width="5"/><path d="M166.00,478.00 L468.00,478.00" fill="none" stroke="#62736e" stroke-width="5"/><path d="M232.00,391.00 L180.00,391.00" fill="none" stroke="#cb8351" stroke-width="3" stroke-dasharray="6 5"/><path d="M249.00,362.00 L249.00,419.00" fill="none" stroke="#cb8351" stroke-width="3" stroke-dasharray="6 5"/><text x="80.00" y="553.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">角码两只脚各一枚M5×8螺钉，旋入各自槽内的T螺母。</text><text x="80.00" y="581.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">先把T螺母滑入/转入槽内，再轻锁角码；校方后锁紧。</text><text x="80.00" y="609.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">图是连接方向剖示，不是角码实际外形；槽型按同一供应商。</text><text x="750.00" y="165.00" font-size="22" fill="#223d38" text-anchor="start" font-weight="650">B / 海洋板怎样固定到型材槽</text><rect x="850" y="250" width="180" height="200" rx="0" fill="#b8c8d0" stroke="#223d38" stroke-width="1.3"/><rect x="795" y="250" width="55" height="200" rx="0" fill="#d5b58a" stroke="#223d38" stroke-width="1.3"/><rect x="850" y="325" width="45" height="50" rx="0" fill="#fffefa" stroke="#223d38" stroke-width="1.3"/><rect x="879" y="333" width="32" height="34" rx="0" fill="#6b9abb" stroke="#223d38" stroke-width="1.3"/><path d="M755.00,350.00 L901.00,350.00" fill="none" stroke="#223d38" stroke-width="7"/><rect x="747" y="333" width="13" height="34" rx="0" fill="#223d38" stroke="#223d38" stroke-width="1.3"/><rect x="785" y="330" width="10" height="40" rx="0" fill="#6b9abb" stroke="#223d38" stroke-width="1.3"/><text x="1070.00" y="285.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">从外到内：</text><text x="1070.00" y="316.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">M5螺钉头</text><text x="1070.00" y="347.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">平垫片</text><text x="1070.00" y="378.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">6mm海洋板</text><text x="1070.00" y="409.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">型材槽内T螺母</text><path d="M795.00,485.00 L850.00,485.00" fill="none" stroke="#cb8351" stroke-width="1.5"/><path d="M795.00,480.00 L795.00,490.00" fill="none" stroke="#cb8351" stroke-width="1.5"/><path d="M850.00,480.00 L850.00,490.00" fill="none" stroke="#cb8351" stroke-width="1.5"/><text x="822.50" y="477.00" font-size="16" fill="#cb8351" text-anchor="middle" font-weight="650">6mm板</text><text x="750.00" y="553.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">F08拟用M5×12；有效啮合与是否顶底必须实际试装。</text><text x="750.00" y="581.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">不要拿F02的M5×8直接穿6mm木板。</text><text x="750.00" y="609.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">面板先只做定位小孔，屏幕/按钮/插头开口另按实物。</text><text x="40.00" y="685.00" font-size="21" fill="#223d38" text-anchor="start" font-weight="650">C / 滑架厚度与螺钉方向：螺钉只锁滑块，不向下顶住导轨</text><rect x="110" y="725" width="380" height="13" rx="0" fill="#b8c8d0" stroke="#223d38" stroke-width="1.3"/><text x="530.00" y="741.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">G08 转接板3</text><rect x="110" y="760" width="150" height="33" rx="0" fill="#6b9abb" stroke="#223d38" stroke-width="1.3"/><text x="530.00" y="776.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">MGN9H轨块总高参考10</text><rect x="110" y="810" width="380" height="18" rx="0" fill="#6b9abb" stroke="#223d38" stroke-width="1.3"/><text x="530.00" y="826.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">G11 底座厚4</text><path d="M145.00,700.00 L145.00,783.00" fill="none" stroke="#cb8351" stroke-width="3" stroke-dasharray="6 5"/><path d="M225.00,700.00 L225.00,783.00" fill="none" stroke="#cb8351" stroke-width="3" stroke-dasharray="6 5"/><text x="40.00" y="881.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">G15：M3×6穿3mm转接板，余下约3mm进入滑块（未计垫片）。收到后量有效牙深，避免顶底或啮合不足。</text><path d="M32.00,916.00 L1368.00,916.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="32.00" y="942.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="400">单位 mm · 尺寸为设计/布局提案，非孔位加工图；未知元件只画安装占位。按标注尺寸，不量屏幕或缩印图。</text><text x="1368.00" y="942.00" font-size="13" fill="#62736e" text-anchor="end" font-weight="400">07 / 07</text></svg>