<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-label="07  三种常见连接的放大装配图"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.pick{cursor:pointer}.pick:hover polygon{stroke:#00876b;stroke-width:3}</style><rect width="1400" height="960" fill="#fffefa"/><text x="32.00" y="34.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="650">BEANLENS  /  ASSEMBLY V4.7 INSET /  2026-10-16</text><text x="32.00" y="77.00" font-size="30" fill="#223d38" text-anchor="start" font-weight="650">07  三种常见连接的放大装配图</text><text x="32.00" y="108.00" font-size="16" fill="#62736e" text-anchor="start" font-weight="400">螺钉长度按真实板厚、垫片和螺纹深度核对；图示只说明方向及层次，不代替零件厂家尺寸图。</text><path d="M32.00,127.00 L1368.00,127.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="40.00" y="165.00" font-size="22" fill="#223d38" text-anchor="start" font-weight="650">A / 两根型材怎样用角码连接</text><rect x="85" y="215" width="75" height="300" rx="0" fill="#30353b" stroke="#223d38" stroke-width="1.3"/><rect x="160" y="440" width="320" height="75" rx="0" fill="#30353b" stroke="#223d38" stroke-width="1.3"/><rect x="160" y="354" width="24" height="86" rx="0" fill="#6b9abb" stroke="#223d38" stroke-width="1.3"/><rect x="160" y="416" width="130" height="24" rx="0" fill="#6b9abb" stroke="#223d38" stroke-width="1.3"/><circle cx="172" cy="391" r="8" fill="white" stroke="#223d38" stroke-width="1.3"/><circle cx="249" cy="428" r="8" fill="white" stroke="#223d38" stroke-width="1.3"/><path d="M121.00,220.00 L121.00,507.00" fill="none" stroke="#8e9aa4" stroke-width="5"/><path d="M166.00,478.00 L468.00,478.00" fill="none" stroke="#8e9aa4" stroke-width="5"/><path d="M232.00,391.00 L180.00,391.00" fill="none" stroke="#cb8351" stroke-width="3" stroke-dasharray="6 5"/><path d="M249.00,362.00 L249.00,419.00" fill="none" stroke="#cb8351" stroke-width="3" stroke-dasharray="6 5"/><text x="80.00" y="553.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">角码两只脚各一枚配套M5螺钉，旋入各自槽内的T螺母。</text><text x="80.00" y="581.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">先把T螺母滑入/转入槽内，再轻锁角码；校方后锁紧。</text><text x="80.00" y="609.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">图是连接方向剖示，不是角码实际外形；槽型按同一供应商。</text><text x="750.00" y="165.00" font-size="22" fill="#223d38" text-anchor="start" font-weight="650">B / 板在框内，角码与隔距从背面托住</text><rect x="800" y="250" width="100" height="100" rx="0" fill="#30353b" stroke="#223d38" stroke-width="1.3"/><rect x="910" y="255" width="210" height="30" rx="0" fill="#d5b58a" stroke="#223d38" stroke-width="1.3"/><rect x="900" y="250" width="10" height="100" rx="0" fill="#6b9abb" stroke="#223d38" stroke-width="1.3"/><rect x="910" y="340" width="100" height="10" rx="0" fill="#6b9abb" stroke="#223d38" stroke-width="1.3"/><rect x="940" y="285" width="20" height="55" rx="0" fill="#e3ebe5" stroke="#223d38" stroke-width="1.3"/><path d="M950.00,251.00 L950.00,355.00" fill="none" stroke="#223d38" stroke-width="3"/><path d="M820.00,300.00 L914.00,300.00" fill="none" stroke="#cb8351" stroke-width="3" stroke-dasharray="6 5"/><path d="M770.00,250.00 L1150.00,250.00" fill="none" stroke="#62736e" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1140.00" y="283.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">板厚6</text><text x="1140.00" y="312.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">面内凹1</text><text x="1140.00" y="341.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">缝约2</text><text x="1140.00" y="370.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">隔距示意11</text><text x="1140.00" y="399.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">M3沉头朝外</text><text x="1140.00" y="428.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">M5锁型材</text><path d="M910.00,390.00 L1120.00,390.00" fill="none" stroke="#cb8351" stroke-width="1.5"/><path d="M910.00,385.00 L910.00,395.00" fill="none" stroke="#cb8351" stroke-width="1.5"/><path d="M1120.00,385.00 L1120.00,395.00" fill="none" stroke="#cb8351" stroke-width="1.5"/><text x="1015.00" y="382.00" font-size="16" fill="#cb8351" text-anchor="middle" font-weight="650">木板不覆盖立柱/横梁</text><text x="750.00" y="459.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">立柱内侧角片背托：示意10mm柱＋1mm调垫。</text><text x="750.00" y="487.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">按角片实物量距；先做一个板角，别一次钻全套。</text><text x="750.00" y="515.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">F11：32个木板点＋2个遮光条点，购40套。</text><text x="750.00" y="543.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">6mm木板浅沉孔，不把螺钉头拉穿；螺纹在内侧。</text><text x="750.00" y="571.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">左、右、后三面下延，板块以外露黑腰线分开。</text><text x="40.00" y="685.00" font-size="21" fill="#223d38" text-anchor="start" font-weight="650">C / 滑架厚度与螺钉方向：螺钉只锁滑块，不向下顶住导轨</text><rect x="110" y="725" width="380" height="13" rx="0" fill="#b8c8d0" stroke="#223d38" stroke-width="1.3"/><text x="530.00" y="741.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">G08 转接板3</text><rect x="110" y="760" width="150" height="33" rx="0" fill="#6b9abb" stroke="#223d38" stroke-width="1.3"/><text x="530.00" y="776.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">MGN9H轨块总高参考10</text><rect x="110" y="810" width="380" height="18" rx="0" fill="#6b9abb" stroke="#223d38" stroke-width="1.3"/><text x="530.00" y="826.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">G11 底座厚4</text><path d="M145.00,700.00 L145.00,783.00" fill="none" stroke="#cb8351" stroke-width="3" stroke-dasharray="6 5"/><path d="M225.00,700.00 L225.00,783.00" fill="none" stroke="#cb8351" stroke-width="3" stroke-dasharray="6 5"/><text x="40.00" y="881.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">G15：M3×6穿3mm转接板，余下约3mm进入滑块（未计垫片）。收到后量有效牙深，避免顶底或啮合不足。</text><path d="M32.00,916.00 L1368.00,916.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="32.00" y="942.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="400">单位 mm · 尺寸为设计/布局提案，非孔位加工图；未知元件只画安装占位。按标注尺寸，不量屏幕或缩印图。</text><text x="1368.00" y="942.00" font-size="13" fill="#62736e" text-anchor="end" font-weight="400">07 / 07</text></svg>