<text x="48" y="426" class="" style="font-size:20px;fill:#c56b13">仅 TB-A 加两段配套 3 位短接片：1–2–3 一组；4–5–6 另一组。</text>
<text x="790" y="426" class="" style="font-size:20px;fill:#7b45b5">TB-B 的 1/2/3/4 分别独立；5、6 空置。</text>
<rect x="48" y="468" width="1400" height="37" rx="0" fill="#eaf2ed" stroke="#e1e8e2" stroke-width="2"/>
<text x="60" y="493" class="" style="font-size:17px">线号</text>
<text x="204" y="493" class="" style="font-size:17px">起点</text>
<text x="660" y="493" class="" style="font-size:17px">终点</text>
<text x="1050" y="493" class="" style="font-size:17px">导线 / 说明</text>
<rect x="48" y="505" width="1400" height="37" rx="0" fill="#fff" stroke="#e1e8e2" stroke-width="2"/>
<text x="60" y="530" class="" style="font-size:17px">W01</text>
<text x="204" y="530" class="" style="font-size:17px">适配器 + → 主 4A</text>
<text x="660" y="530" class="" style="font-size:17px">TB-A 1 上</text>
<text x="1050" y="530" class="" style="font-size:17px">0.75mm²；先测插头极性</text>
<rect x="48" y="542" width="1400" height="37" rx="0" fill="#eaf2ed" stroke="#e1e8e2" stroke-width="2"/>
<text x="60" y="567" class="" style="font-size:17px">W02</text>
<text x="204" y="567" class="" style="font-size:17px">适配器 −</text>
<text x="660" y="567" class="" style="font-size:17px">TB-A 4 上</text>
<text x="1050" y="567" class="" style="font-size:17px">0.75mm² 黑线</text>
<rect x="48" y="579" width="1400" height="37" rx="0" fill="#fff" stroke="#e1e8e2" stroke-width="2"/>
<text x="60" y="604" class="" style="font-size:17px">W03/04</text>
<text x="204" y="604" class="" style="font-size:17px">TB-A 1 下 → 灯 2A / 4 下</text>
<text x="660" y="604" class="" style="font-size:17px">灯带 + / −</text>
<text x="1050" y="604" class="" style="font-size:17px">各自接一根，不借铝框回流</text>
<rect x="48" y="616" width="1400" height="37" rx="0" fill="#eaf2ed" stroke="#e1e8e2" stroke-width="2"/>
<text x="60" y="641" class="" style="font-size:17px">W05/06</text>
<text x="204" y="641" class="" style="font-size:17px">TB-A 2 下 → 输入 2A / 5 下</text>
<text x="660" y="641" class="" style="font-size:17px">模块 A IN+ / IN−</text>
<text x="1050" y="641" class="" style="font-size:17px">24V 输入对</text>
<rect x="48" y="653" width="1400" height="37" rx="0" fill="#fff" stroke="#e1e8e2" stroke-width="2"/>
<text x="60" y="678" class="" style="font-size:17px">W07/08</text>
<text x="204" y="678" class="" style="font-size:17px">TB-A 3 下 → 输入 3A / 6 下</text>
<text x="660" y="678" class="" style="font-size:17px">模块 B IN+ / IN−</text>
<text x="1050" y="678" class="" style="font-size:17px">24V 输入对</text>
<rect x="48" y="690" width="1400" height="37" rx="0" fill="#eaf2ed" stroke="#e1e8e2" stroke-width="2"/>
<text x="60" y="715" class="" style="font-size:17px">W09/10</text>
<text x="204" y="715" class="" style="font-size:17px">模块 A OUT+ / OUT−</text>
<text x="660" y="715" class="" style="font-size:17px">TB-B 1 上 / 2 上</text>
<text x="1050" y="715" class="" style="font-size:17px">5V 输出对</text>
<rect x="48" y="727" width="1400" height="37" rx="0" fill="#fff" stroke="#e1e8e2" stroke-width="2"/>
<text x="60" y="752" class="" style="font-size:17px">W11/12</text>
<text x="204" y="752" class="" style="font-size:17px">TB-B 1 下 / 2 下</text>
<text x="660" y="752" class="" style="font-size:17px">P09 配电板 + / −</text>
<text x="1050" y="752" class="" style="font-size:17px">USB + 独立辅助焊盘/端子</text>
<rect x="48" y="764" width="1400" height="37" rx="0" fill="#eaf2ed" stroke="#e1e8e2" stroke-width="2"/>
<text x="60" y="789" class="" style="font-size:17px">W13/14</text>
<text x="204" y="789" class="" style="font-size:17px">模块 B OUT+ / OUT−</text>
<text x="660" y="789" class="" style="font-size:17px">TB-B 3 上 / 4 上</text>
<text x="1050" y="789" class="" style="font-size:17px">6V 输出对</text>
<rect x="48" y="801" width="1400" height="37" rx="0" fill="#fff" stroke="#e1e8e2" stroke-width="2"/>
<text x="60" y="826" class="" style="font-size:17px">W15/16</text>
<text x="204" y="826" class="" style="font-size:17px">TB-B 3 下 / 4 下</text>
<text x="660" y="826" class="" style="font-size:17px">XT30 → 舵机 V+ / GND</text>
<text x="1050" y="826" class="" style="font-size:17px">0.75mm²；电容并在舵机近端</text>
<rect x="48" y="838" width="1400" height="37" rx="0" fill="#eaf2ed" stroke="#e1e8e2" stroke-width="2"/>
<text x="60" y="863" class="" style="font-size:17px">W17</text>
<text x="204" y="863" class="" style="font-size:17px">C6 GPIO2</text>
<text x="660" y="863" class="" style="font-size:17px">舵机 SIGNAL</text>
<text x="1050" y="863" class="" style="font-size:17px">只传信号，必要时加 O01 缓冲</text>
<rect x="48" y="900" width="678" height="77" rx="10" fill="#fff6e9" stroke="#c8d6ce" stroke-width="2"/>
<text x="65" y="932" class="bold" style="font-size:23px">压接与绝缘</text>
<text x="65" y="962" class="" style="font-size:18px">TB 螺钉配 M3 叉形/环形压接端子；降压板端口用合适管形端头。</text>
<rect x="750" y="900" width="698" height="77" rx="10" fill="#eee9f6" stroke="#c8d6ce" stroke-width="2"/>
<text x="767" y="932" class="bold" style="font-size:23px">不要额外拉三根“地线桥”</text>
<text x="767" y="962" class="" style="font-size:18px">TB-B 2/4 不再外接 TB-A 4；共地已通过非隔离降压内部实现。</text>
<polyline class="wire" data-rail="" points="48,1000 1452,1000" stroke="#d2ddd6"/>
<text x="48" y="1030" class="" style="font-size:16px">2026-10-16 · 样机方案 / 尚未带载、带豆或焊接验收 · 电气连接按端子文字核对，不按图中物理引脚位置猜接</text>
<text x="1390" y="1030" class="" style="font-size:16px">2 / 4</text>
</svg>