<text x="1010" y="422" class="small" text-anchor="start">用28套，购32套含备用</text>
<text x="1010" y="452" class="small" text-anchor="start">每套2螺钉＋2匹配T螺母</text>
<text x="1010" y="482" class="small" text-anchor="start">绿色三角仅标示安装区域</text>
<text x="1010" y="512" class="small" text-anchor="start">两侧角码可能在投影中重叠</text>
<text x="1010" y="585" class="note" text-anchor="start">称台底板四角需避角码</text>
<text x="1010" y="616" class="small" text-anchor="start">约25×25核对区，不先切角</text>
<text x="1010" y="646" class="small" text-anchor="start">不抬高称台去硬凑净空</text>
<text x="1010" y="695" class="small" text-anchor="start">主斗110：330→440，圈顶442</text>
<text x="1010" y="725" class="small" text-anchor="start">梁顶324＋托耳6＝330</text>
<text x="1010" y="755" class="small" text-anchor="start">斗顶440＋顶框20＝460</text>
