<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-label="06  组装顺序与采购对照"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.pick{cursor:pointer}.pick:hover polygon{stroke:#00876b;stroke-width:3}</style><rect width="1400" height="960" fill="#fffefa"/><text x="32.00" y="34.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="650">BEANLENS  /  ASSEMBLY V4.12 /  2026-10-17</text><text x="32.00" y="77.00" font-size="30" fill="#223d38" text-anchor="start" font-weight="650">06  组装顺序与采购对照</text><text x="32.00" y="108.00" font-size="16" fill="#62736e" text-anchor="start" font-weight="400">先校框与手推，再焊件/空载/光学/称重，最后小量带豆；执行器电源不经主板。</text><path d="M32.00,127.00 L1368.00,127.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><rect x="40" y="155" width="1320" height="46" rx="0" fill="#edf3ef" stroke="#b8c7c1" stroke-width="1.3"/><text x="49.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">步</text><text x="104.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">装配对象</text><text x="429.00" y="177.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="650">操作与预期</text><path d="M40.00,201.00 L1360.00,201.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="223.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">1</text><text x="104.00" y="223.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">黑2020 / F01–F02</text><text x="429.00" y="223.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">460立柱与上下/中框松装，校220×240×460和对角线，再锁紧。</text><path d="M40.00,247.00 L1360.00,247.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="269.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">2</text><text x="104.00" y="269.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">G11/G06/G08/G07</text><text x="429.00" y="269.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">同平面装双轨，先手推15行程，平顺无偏摆后才装执行器。</text><path d="M40.00,293.00 L1360.00,293.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="315.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">3</text><text x="104.00" y="315.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">PP主斗/F18/G12/F19/G21</text><text x="429.00" y="315.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">练习厚薄PP焊接；固定体焊成连续U槽，冷却后量2.3闸缝、试滑。</text><path d="M40.00,339.00 L1360.00,339.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="361.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">4</text><text x="104.00" y="361.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">H09/Q01–Q04/F13</text><text x="429.00" y="361.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">下槽体先定位；托环坐实4金属托片，再M3锁紧，不用螺钉硬拉焊件。</text><path d="M40.00,385.00 L1360.00,385.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="407.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">5</text><text x="104.00" y="407.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">B16/B11/B14/B15</text><text x="429.00" y="407.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">样刷试装前后各5；毛尖Z308，先无刷与小侵入量单槽对比。</text><path d="M40.00,431.00 L1360.00,431.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="453.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">6</text><text x="104.00" y="453.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">A03/R01/S01</text><text x="429.00" y="453.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">独立6V空载，小角度核方向/限位；上电禁止自动开闸。</text><path d="M40.00,477.00 L1360.00,477.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="499.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">7</text><text x="104.00" y="499.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">B01/B13/A05/PH01</text><text x="429.00" y="499.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">相机、灯、SEN0503支架按实物；IR开启/关闭对照拍摄。</text><path d="M40.00,523.00 L1360.00,523.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="545.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">8</text><text x="104.00" y="545.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">W06/W01/W05/B12</text><text x="429.00" y="545.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">核称重件接口/高度再定孔；盒不碰墙、称台无旁路，静态标定。</text><path d="M40.00,569.00 L1360.00,569.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="591.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">9</text><text x="104.00" y="591.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">A07/A08/A17/P01–P14</text><text x="429.00" y="591.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">机外YU2405量24V/极性，5V板空载量5V，UBEC断电设6V再量。</text><path d="M40.00,615.00 L1360.00,615.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="637.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">10</text><text x="104.00" y="637.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">双屏/按钮/9块木板</text><text x="429.00" y="637.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">保留屏后服务腔、天线与检修；SEN信号断开GPIO先测两状态。</text><path d="M40.00,661.00 L1360.00,661.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="49.00" y="683.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">11</text><text x="104.00" y="683.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">无执行器→空载→单槽→五槽</text><text x="429.00" y="683.00" font-size="16" fill="#223d38" text-anchor="start" font-weight="400">STOP/超时/失联先撤销送料；未确认关限位不能报已关。</text><path d="M40.00,707.00 L1360.00,707.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="40.00" y="765.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">角码/螺钉用量：骨架28用/32购；M5和T螺母56用/64购；面板F11与顶托F13分开计。</text><text x="40.00" y="796.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">完整114项物料沿用V4.11 BOM；已有/备选不重复购买，YU2405插头与报价待实际订单。</text><text x="40.00" y="827.00" font-size="17" fill="#223d38" text-anchor="start" font-weight="400">这是一份装配和验收顺序；不是按“动画播放成功”判定机器已可安全带豆运行。</text><path d="M32.00,916.00 L1368.00,916.00" fill="none" stroke="#b8c7c1" stroke-width="1.5"/><text x="32.00" y="942.00" font-size="13" fill="#62736e" text-anchor="start" font-weight="400">单位 mm · 尺寸为设计/布局提案，非孔位加工图；未知元件只画安装占位。按标注尺寸，不量屏幕或缩印图。</text><text x="1368.00" y="942.00" font-size="13" fill="#62736e" text-anchor="end" font-weight="400">06 / 12</text></svg>