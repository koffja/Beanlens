<text x="40" y="615" font-size="15">信号参考地共地；舵机大电流独立回UBEC，不能经过BOX地针/杜邦线。J10没有电源或GND。</text><text x="40" y="645" font-size="15">BOX信号GND仍从原理图J6（PH2.0口1）2脚引出；针1方向、其余针绝缘与缓冲全引脚继续看H1信号图。</text><text x="40" y="687" font-size="15" font-weight="bold">两路采图均可用 → 同一cycle_id配对/保存 → 才允许放豆；一侧失败则拒判/保持，不能用另一侧自动算正常。</text><text x="40" y="730" font-size="13" fill="#6a7f89">持续49.25W / 短峰64.25W只是预算；双摄内存/电流、5V整板SKU、照明、保险和温升仍待验证。</text><a href="../hackathon-h1/05-signals.svg"><text x="40" y="767" font-size="14" fill="#146d83">查看沿用的H1完整缓冲/限位引脚图 ↗</text></a></g></svg>
