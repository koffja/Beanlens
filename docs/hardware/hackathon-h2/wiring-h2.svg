<text x="65" y="163" font-size="18">YU2405 机外电源</text><text x="65" y="194" font-size="16">24V / 5A</text><text x="370" y="161" font-size="17">TPS5450候选整板</text><text x="370" y="193" font-size="15">24V → 5.00V</text><text x="370" y="312" font-size="17">UBEC5A，设6V</text><text x="370" y="345" font-size="15">独立给MG996R供电</text><text x="370" y="462" font-size="17">24V灯带，上2＋下2</text><text x="370" y="496" font-size="14">总有效0.4m，≤8W预算</text>
