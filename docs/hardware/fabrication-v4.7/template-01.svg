<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-label="A：主斗前后片 / 内面1:1"><style>text{font-family:Arial,"PingFang SC",sans-serif}</style><rect width="210" height="297" fill="white"/><text x="12" y="13" font-size="3.2" fill="#243e36" text-anchor="start">BEANLENS / V4.7 / 2026-10-16</text><text x="12" y="24" font-size="5.6" fill="#243e36" text-anchor="start">A：主斗前后片 / 内面1:1</text><text x="12" y="31" font-size="3.4" fill="#243e36" text-anchor="start">黑线为内表面控制线；外留修边量；先纸样，再试焊。</text><polygon points="37,60 173,60 160.0,182.10241602851272 50.0,182.10241602851272" fill="#eef5ee" stroke="#243e36" stroke-width=".4"/><path d="M37,54L173,54" fill="none" stroke="#a65d32" stroke-width=".3"/><text x="105.0" y="52.0" font-size="3.5" fill="#a65d32" text-anchor="middle">136</text><path d="M50.0,189.10241602851272L160.0,189.10241602851272" fill="none" stroke="#a65d32" stroke-width=".3"/><text x="105.0" y="187.10241602851272" font-size="3.5" fill="#a65d32" text-anchor="middle">110</text><text x="105.0" y="121.05120801425636" font-size="4.5" fill="#243e36" text-anchor="middle">A 前／后 ×2</text><path d="M27,60L27,182.10241602851272" fill="none" stroke="#a65d32" stroke-width=".3"/><text x="29" y="125" font-size="3.5" fill="#a65d32" text-anchor="middle">122.10斜高</text><text x="15" y="220" font-size="3.3" fill="#243e36" text-anchor="start">垂直高度110，不等于本片斜高。</text><text x="15" y="225" font-size="3.3" fill="#243e36" text-anchor="start">下边相对上边每侧缩13；相邻斜接边约122.79。</text><text x="15" y="230" font-size="3.3" fill="#243e36" text-anchor="start">本页打印两份。先在纸上闭合，确认底口110×30。</text><text x="15" y="235" font-size="3.3" fill="#243e36" text-anchor="start">PP-H 2mm；控制线外留约1mm，试夹后刮修坡口。</text><path d="M20,279L120,279" fill="none" stroke="#243e36" stroke-width=".3"/><path d="M20,277L20,281" fill="none" stroke="#243e36" stroke-width=".3"/><path d="M120,277L120,281" fill="none" stroke="#243e36" stroke-width=".3"/><text x="70" y="277" font-size="3.1" fill="#243e36" text-anchor="middle">100mm校验线：打印100%，关闭缩放</text><text x="12" y="290" font-size="3" fill="#243e36" text-anchor="start">2mm板厚、坡口/焊筋/最终孔位须实物修配，非免试装刀模。</text><text x="198" y="290" font-size="3" fill="#243e36" text-anchor="end">1/6</text></svg>