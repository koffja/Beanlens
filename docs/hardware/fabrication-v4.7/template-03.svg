<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-label="口圈与下接环 / 平面1:1"><style>text{font-family:Arial,"PingFang SC",sans-serif}</style><rect width="210" height="297" fill="white"/><text x="12" y="13" font-size="3.2" fill="#243e36" text-anchor="start">BEANLENS / V4.7 / 2026-10-16</text><text x="12" y="24" font-size="5.6" fill="#243e36" text-anchor="start">口圈与下接环 / 平面1:1</text><text x="12" y="31" font-size="3.4" fill="#243e36" text-anchor="start">黑线为内表面控制线；外留修边量；先纸样，再试焊。</text><rect x="26" y="44" width="158" height="158" fill="#eef5ee" stroke="#243e36" stroke-width=".3"/><rect x="37" y="55" width="136" height="136" fill="white" stroke="#243e36" stroke-width=".3"/><text x="105" y="115" font-size="4" fill="#243e36" text-anchor="middle">口圈：PP2，外158 / 内136</text><path d="M26,38L184,38" fill="none" stroke="#a65d32" stroke-width=".3"/><text x="105.0" y="36.0" font-size="3.5" fill="#a65d32" text-anchor="middle">158</text><text x="14" y="213" font-size="3.5" fill="#243e36" text-anchor="start">口圈焊在斗顶；坐木壳Z440，上表面Z442。</text><rect x="43" y="228" width="124" height="44" fill="#eef5ee" stroke="#243e36" stroke-width=".3"/><rect x="50" y="235" width="110" height="30" fill="white" stroke="#243e36" stroke-width=".3"/><text x="105" y="253" font-size="3.4" fill="#243e36" text-anchor="middle">接环：PP3 / 内110×30</text><text x="14" y="222" font-size="3.5" fill="#243e36" text-anchor="start">接环在Z327→330；小过渡斗接其下方。</text><path d="M20,279L120,279" fill="none" stroke="#243e36" stroke-width=".3"/><path d="M20,277L20,281" fill="none" stroke="#243e36" stroke-width=".3"/><path d="M120,277L120,281" fill="none" stroke="#243e36" stroke-width=".3"/><text x="70" y="277" font-size="3.1" fill="#243e36" text-anchor="middle">100mm校验线：打印100%，关闭缩放</text><text x="12" y="290" font-size="3" fill="#243e36" text-anchor="start">2mm板厚、坡口/焊筋/最终孔位须实物修配，非免试装刀模。</text><text x="198" y="290" font-size="3" fill="#243e36" text-anchor="end">3/6</text></svg>