<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-label="B：主斗左右片 / 内面1:1"><style>text{font-family:Arial,"PingFang SC",sans-serif}</style><rect width="210" height="297" fill="white"/><text x="12" y="13" font-size="3.2" fill="#243e36" text-anchor="start">BEANLENS / V4.7 / 2026-10-16</text><text x="12" y="24" font-size="5.6" fill="#243e36" text-anchor="start">B：主斗左右片 / 内面1:1</text><text x="12" y="31" font-size="3.4" fill="#243e36" text-anchor="start">黑线为内表面控制线；外留修边量；先纸样，再试焊。</text><polygon points="37,60 173,60 120.0,170.76551810017412 90.0,170.76551810017412" fill="#eef5ee" stroke="#243e36" stroke-width=".4"/><path d="M37,54L173,54" fill="none" stroke="#a65d32" stroke-width=".3"/><text x="105.0" y="52.0" font-size="3.5" fill="#a65d32" text-anchor="middle">136</text><path d="M90.0,177.76551810017412L120.0,177.76551810017412" fill="none" stroke="#a65d32" stroke-width=".3"/><text x="105.0" y="175.76551810017412" font-size="3.5" fill="#a65d32" text-anchor="middle">30</text><text x="105.0" y="115.38275905008706" font-size="4.5" fill="#243e36" text-anchor="middle">B 左／右 ×2</text><path d="M27,60L27,170.76551810017412" fill="none" stroke="#a65d32" stroke-width=".3"/><text x="28" y="120" font-size="3.5" fill="#a65d32" text-anchor="middle">110.77斜高</text><text x="15" y="217" font-size="3.3" fill="#243e36" text-anchor="start">本片下边30，不是110；左右片与前后片不同。</text><text x="15" y="222" font-size="3.3" fill="#243e36" text-anchor="start">每侧缩53，四片顶边均为136。</text><text x="15" y="227" font-size="3.3" fill="#243e36" text-anchor="start">本页打印两份。用上下定位框维持垂直高度110。</text><text x="15" y="232" font-size="3.3" fill="#243e36" text-anchor="start">角度由试夹得，不把所有接边统一切成45°。</text><path d="M20,279L120,279" fill="none" stroke="#243e36" stroke-width=".3"/><path d="M20,277L20,281" fill="none" stroke="#243e36" stroke-width=".3"/><path d="M120,277L120,281" fill="none" stroke="#243e36" stroke-width=".3"/><text x="70" y="277" font-size="3.1" fill="#243e36" text-anchor="middle">100mm校验线：打印100%，关闭缩放</text><text x="12" y="290" font-size="3" fill="#243e36" text-anchor="start">2mm板厚、坡口/焊筋/最终孔位须实物修配，非免试装刀模。</text><text x="198" y="290" font-size="3" fill="#243e36" text-anchor="end">2/6</text></svg>