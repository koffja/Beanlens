<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-label="POM支承、隔距与闸片层次"><style>text{font-family:Arial,"PingFang SC",sans-serif}</style><rect width="210" height="297" fill="white"/><text x="12" y="13" font-size="3.2" fill="#243e36" text-anchor="start">BEANLENS / V4.7 / 2026-10-16</text><text x="12" y="24" font-size="5.6" fill="#243e36" text-anchor="start">POM支承、隔距与闸片层次</text><text x="12" y="31" font-size="3.4" fill="#243e36" text-anchor="start">黑线为内表面控制线；外留修边量；先纸样，再试焊。</text><rect x="35" y="50" width="140" height="30" fill="#eef5ee" stroke="#243e36" stroke-width=".3"/><rect x="64" y="59" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="81" y="59" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="98" y="59" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="115" y="59" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="132" y="59" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><circle cx="42.5" cy="65" r="1.6" fill="none" stroke="#bd473c" stroke-width=".25" stroke-dasharray="1 .7"/><circle cx="167.5" cy="65" r="1.6" fill="none" stroke="#bd473c" stroke-width=".25" stroke-dasharray="1 .7"/><text x="35" y="43" font-size="3.6" fill="#243e36" text-anchor="start">S：POM4，140×30，仅一片</text><text x="15" y="94" font-size="3.3" fill="#243e36" text-anchor="start">POM顶面Z290，上承闸片；五窗必须贯通。</text><text x="15" y="99" font-size="3.3" fill="#243e36" text-anchor="start">不能与PP热焊；螺栓夹持在远离豆路的两翼。</text><rect x="55" y="124" width="10" height="30" fill="#dfe9ec" stroke="#243e36" stroke-width=".3"/><rect x="145" y="124" width="10" height="30" fill="#dfe9ec" stroke="#243e36" stroke-width=".3"/><text x="105" y="118" font-size="3.4" fill="#243e36" text-anchor="middle">隔片10×30，两处：2mm＋约0.3薄片</text><text x="15" y="167" font-size="3.3" fill="#243e36" text-anchor="start">隔片在140宽板的X0→10、130→140。</text><text x="15" y="172" font-size="3.3" fill="#243e36" text-anchor="start">闸片扫掠X15→125，不能被隔片或螺钉挡住。</text><rect x="20" y="192" width="45" height="12" fill="#b8d8c9" stroke="#243e36" stroke-width=".3"/><text x="72" y="196" font-size="3.2" fill="#243e36" text-anchor="start">上PP3＋PP3，Z292.3→298.3</text><rect x="20" y="204" width="45" height="4.6" fill="#efccaa" stroke="#243e36" stroke-width=".3"/><text x="72" y="208" font-size="3.2" fill="#243e36" text-anchor="start">间隙2.3：闸片实厚＋余量</text><rect x="20" y="208.6" width="45" height="8" fill="#d2dbe2" stroke="#243e36" stroke-width=".3"/><text x="72" y="212.6" font-size="3.2" fill="#243e36" text-anchor="start">POM4，Z286→290</text><rect x="20" y="216.6" width="45" height="12" fill="#b8d8c9" stroke="#243e36" stroke-width=".3"/><text x="72" y="220.6" font-size="3.2" fill="#243e36" text-anchor="start">下PP3＋PP3，Z280→286</text><text x="15" y="246" font-size="3.3" fill="#243e36" text-anchor="start">剖面为2倍示意；只有上方平面和隔片为1:1。</text><text x="15" y="251" font-size="3.3" fill="#243e36" text-anchor="start">上罩仍需配G13/G20后防护，不能直接加平底撞滑块。</text><path d="M20,279L120,279" fill="none" stroke="#243e36" stroke-width=".3"/><path d="M20,277L20,281" fill="none" stroke="#243e36" stroke-width=".3"/><path d="M120,277L120,281" fill="none" stroke="#243e36" stroke-width=".3"/><text x="70" y="277" font-size="3.1" fill="#243e36" text-anchor="middle">100mm校验线：打印100%，关闭缩放</text><text x="12" y="290" font-size="3" fill="#243e36" text-anchor="start">2mm板厚、坡口/焊筋/最终孔位须实物修配，非免试装刀模。</text><text x="198" y="290" font-size="3" fill="#243e36" text-anchor="end">6/6</text></svg>