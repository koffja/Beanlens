<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-label="五槽PP叠片 / 平面1:1"><style>text{font-family:Arial,"PingFang SC",sans-serif}</style><rect width="210" height="297" fill="white"/><text x="12" y="13" font-size="3.2" fill="#243e36" text-anchor="start">BEANLENS / V4.7 / 2026-10-16</text><text x="12" y="24" font-size="5.6" fill="#243e36" text-anchor="start">五槽PP叠片 / 平面1:1</text><text x="12" y="31" font-size="3.4" fill="#243e36" text-anchor="start">黑线为内表面控制线；外留修边量；先纸样，再试焊。</text><rect x="35" y="48" width="140" height="30" fill="#eef5ee" stroke="#243e36" stroke-width=".3"/><rect x="64" y="57" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="81" y="57" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="98" y="57" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="115" y="57" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="132" y="57" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><circle cx="42.5" cy="63" r="1.6" fill="none" stroke="#bd473c" stroke-width=".25" stroke-dasharray="1 .7"/><circle cx="167.5" cy="63" r="1.6" fill="none" stroke="#bd473c" stroke-width=".25" stroke-dasharray="1 .7"/><text x="35" y="40" font-size="3.6" fill="#243e36" text-anchor="start">U1/U2：PP3，140×30，做两片</text><text x="15" y="135" font-size="3.3" fill="#243e36" text-anchor="start">孔左边X＝29、46、63、80、97；每孔14×12。</text><text x="15" y="140" font-size="3.3" fill="#243e36" text-anchor="start">上片孔Y9→21；后罩另做，不把平板伸到加强梁上方。</text><rect x="35" y="163" width="140" height="18" fill="#eef5ee" stroke="#243e36" stroke-width=".3"/><rect x="64" y="166" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="81" y="166" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="98" y="166" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="115" y="166" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><rect x="132" y="166" width="14" height="12" fill="white" stroke="#243e36" stroke-width=".3"/><circle cx="42.5" cy="172" r="1.6" fill="none" stroke="#bd473c" stroke-width=".25" stroke-dasharray="1 .7"/><circle cx="167.5" cy="172" r="1.6" fill="none" stroke="#bd473c" stroke-width=".25" stroke-dasharray="1 .7"/><text x="35" y="157" font-size="3.6" fill="#243e36" text-anchor="start">L1/L2：PP3，140×18，做两片</text><text x="15" y="203" font-size="3.3" fill="#243e36" text-anchor="start">下片孔Y3→15；装配后与上片同处整机Y114→126。</text><text x="15" y="208" font-size="3.3" fill="#243e36" text-anchor="start">红圈Ø3.2只是候选安装孔，纸样避开滑轨后再钻。</text><text x="15" y="213" font-size="3.3" fill="#243e36" text-anchor="start">本页打印两份，可分别转印上下两层。</text><text x="15" y="218" font-size="3.3" fill="#243e36" text-anchor="start">3mm筋位于相邻窗口之间；不能把筋锯掉。</text><text x="15" y="223" font-size="3.3" fill="#243e36" text-anchor="start">窗口先做一片检查；同批CNC比手修更容易对齐。</text><path d="M20,279L120,279" fill="none" stroke="#243e36" stroke-width=".3"/><path d="M20,277L20,281" fill="none" stroke="#243e36" stroke-width=".3"/><path d="M120,277L120,281" fill="none" stroke="#243e36" stroke-width=".3"/><text x="70" y="277" font-size="3.1" fill="#243e36" text-anchor="middle">100mm校验线：打印100%，关闭缩放</text><text x="12" y="290" font-size="3" fill="#243e36" text-anchor="start">2mm板厚、坡口/焊筋/最终孔位须实物修配，非免试装刀模。</text><text x="198" y="290" font-size="3" fill="#243e36" text-anchor="end">5/6</text></svg>